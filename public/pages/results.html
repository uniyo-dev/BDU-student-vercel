<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU Portal - Results</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/banner.css">
  <link rel="stylesheet" href="/css/semester.css">
  <link rel="stylesheet" href="/css/gpa.css">
  <link rel="stylesheet" href="/css/courses.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-container { height: 100vh; display: flex; flex-direction: column; }
    .scroll-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 70px; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 420px; width: 100%; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="banner-header">
    <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="BDU Logo">
      <div>
        <div class="uni-name">Bahir Dar University</div>
        <div class="uni-sub">Student Portal</div>
      </div>
    </div>
  </div>

  <div class="portal-header">
    <h1><i class="fas fa-graduation-cap"></i> BDU Student Portal</h1>
    <span class="sub" onclick="location.href='/pages/dashboard.html'"><i class="fas fa-arrow-left"></i> Back</span>
  </div>

  <div class="scroll-content" id="results-scroll">
    <div id="results-content"></div>
  </div>

  <div class="bottom-nav">
    <span onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</span>
    <span class="active"><i class="fas fa-list-ul"></i> Results</span>
    <span onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</span>
    <span onclick="location.href='/pages/profile.html'"><i class="fas fa-user"></i> Profile</span>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) {
    window.location.href = '/';
    return;
  }
  var data = JSON.parse(saved);
  var registrations = data.registrations || [];
  var courses = data.courses || [];
  
  var html = '';
  
  registrations.forEach(function(reg, index) {
    var semClass = index === 0 ? 'semester-1' : 'semester-2';
    var semCourses = courses.find(function(c) { return c.semester === reg.semester; });
    
    html += '<div class="semester-block ' + semClass + '">';
    html += '<div class="semester-title"><i class="fas fa-calendar-alt"></i> Semester ' + reg.semester + ' (' + reg.acYear + ')';
    html += '<span class="status-badge pass" style="margin-left:auto;">' + (reg.status || 'Pass') + '</span></div>';
    
    html += '<div class="gpa-grid" style="margin:0;">';
    html += '<div class="gpa-card sgpa"><div class="gpa-value">' + reg.sgpa + '</div><div class="gpa-label">SGPA</div></div>';
    html += '<div class="gpa-card cgpa"><div class="gpa-value">' + reg.cgpa + '</div><div class="gpa-label">CGPA</div></div>';
    html += '</div>';
    
    if (semCourses && semCourses.courses) {
      semCourses.courses.forEach(function(c) {
        html += '<div class="course-row">';
        html += '<div class="course-info"><div class="cname">' + c.title + '</div>';
        html += '<div><span class="ccode">' + c.code + '</span><span class="cred">' + c.credit + ' Cr</span></div></div>';
        html += '<div class="course-grade"><div><span class="score">' + (c.percentage || '—') + '</span>';
        html += '<span class="letter">' + c.grade + '</span></div>';
        html += '<div class="pts">' + c.points + ' pts</div></div></div>';
      });
    }
    
    html += '</div>';
  });
  
  document.getElementById('results-content').innerHTML = html;
})();
</script>
</body>
</html>
