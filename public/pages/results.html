<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>BDU Portal - Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared/variables.css">
  <link rel="stylesheet" href="/css/shared/reset.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/banner.css">
  <link rel="stylesheet" href="/css/shared/navigation.css">
  <link rel="stylesheet" href="/css/shared/animations.css">
  <link rel="stylesheet" href="/css/shared/utilities.css">
  <link rel="stylesheet" href="/css/results/semester.css">
  <link rel="stylesheet" href="/css/results/gpa.css">
  <link rel="stylesheet" href="/css/results/courses.css">
  <style>
    #page-results { background: #f8fafc; padding-bottom: 96px; }
    .results-header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white; padding: 48px 20px 24px;
    }
    .back-btn {
      width: 36px; height: 36px; background: rgba(255,255,255,0.15);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: white;
    }
    .back-btn svg { width: 20px; height: 20px; }
    .results-content { padding: 20px 16px; }
    .semester-block { margin-bottom: 28px; }
    .semester-label {
      font-size: 13px; font-weight: 700; color: #475569;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .badge-passed {
      font-size: 10px; background: #f0fdf4; color: #15803d;
      border: 1px solid #bbf7d0; padding: 2px 8px; border-radius: 100px; font-weight: 700;
    }
    .gpa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .gpa-card-primary {
      border-radius: 18px; padding: 16px; color: white;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      box-shadow: 0 4px 12px rgba(37,99,235,0.2);
    }
    .gpa-card-primary .gpa-label { font-size: 11px; opacity: 0.8; font-weight: 600; }
    .gpa-card-primary .gpa-value { font-size: 34px; font-weight: 800; }
    .gpa-card-primary .gpa-status { font-size: 10px; margin-top: 8px; opacity: 0.75; text-transform: uppercase; }
    .gpa-card-secondary {
      background: white; border-radius: 18px; padding: 16px;
      border: 1px solid #f1f5f9;
    }
    .gpa-card-secondary .gpa-label { font-size: 11px; color: #64748b; font-weight: 600; }
    .gpa-card-secondary .gpa-value { font-size: 28px; font-weight: 800; }
    .courses-title { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 12px; }
    .course-card {
      background: white; border-radius: 14px; padding: 14px;
      border: 1px solid #f1f5f9; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; margin-bottom: 10px;
    }
    .course-info { flex: 1; min-width: 0; }
    .course-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .course-code {
      font-size: 10px; font-family: 'Courier New', monospace;
      font-weight: 700; color: #94a3b8; background: #f8fafc;
      padding: 2px 8px; border-radius: 6px;
    }
    .course-credits { font-size: 10px; color: #94a3b8; }
    .course-name {
      font-size: 13px; font-weight: 600; color: #0f172a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .grade-badge { font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 10px; flex-shrink: 0; }
    .grade-A { background: #d1fae5; color: #065f46; }
    .grade-B { background: #dbeafe; color: #1e40af; }
    .grade-C { background: #fef3c7; color: #92400e; }
    .grade-D { background: #ffedd5; color: #9a3412; }
    .grade-F { background: #fee2e2; color: #991b1b; }
    .grade-P { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>

<div id="page-results" class="page active">
  <div class="results-header">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <button class="back-btn" onclick="location.href='/pages/dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <div style="font-size:20px;font-weight:800;">Academic Results</div>
        <div style="font-size:12px;opacity:0.7;margin-top:2px;">Your semester performance</div>
      </div>
    </div>
  </div>
  <div class="results-content" id="results-content"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='/pages/dashboard.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
  </button>
  <button class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    RESULTS
  </button>
  <button class="nav-item" onclick="location.href='/pages/placement.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    PLACEMENT
  </button>
  <button class="nav-item" onclick="location.href='/pages/profile.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PROFILE
  </button>
</nav>

<!-- Shared JS -->
<script src="/js/shared/config.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/ui.js"></script>
<!-- Results JS -->
<script src="/js/results/results.js"></script>
<script src="/js/results/renderer-results.js"></script>
</body>
</html>
