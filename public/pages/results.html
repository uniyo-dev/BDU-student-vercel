<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BDU Portal - Results</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: white; }
    .app { width: 100vw; height: 100vh; height: 100dvh; background: white; display: flex; flex-direction: column; }
    
    .banner { width: 100%; height: 100px; position: relative; flex-shrink: 0; }
    .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .banner-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 25px 16px 10px;
      background: linear-gradient(transparent, rgba(11,30,51,0.9));
      color: white; display: flex; align-items: center; gap: 10px;
    }
    .banner-overlay img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    .banner-title { font-size: 13px; font-weight: 700; }
    .banner-sub { font-size: 10px; opacity: 0.8; }
    
    .header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e3eaf2; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 700; color: #0b1e33; }
    .back-btn { font-size: 13px; color: #1a5f9c; cursor: pointer; background: #f0f4fa; padding: 6px 14px; border-radius: 40px; border: none; }
    
    .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
    
    .semester-block {
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      border: 2px solid #93c5fd;
    }
    .semester-block:nth-child(even) {
      background: linear-gradient(135deg, #ede9fe, #faf5ff);
      border: 2px solid #c4b5fd;
    }
    .sem-title { font-size: 15px; font-weight: 800; color: #1a5f9c; margin-bottom: 12px; }
    
    .gpa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .gpa-card { border-radius: 12px; padding: 14px; text-align: center; background: linear-gradient(135deg, #d1fae5, #ecfdf5); border: 2px solid #6ee7b7; }
    .gpa-card.cgpa { background: linear-gradient(135deg, #dbeafe, #eff6ff); border: 2px solid #93c5fd; }
    .gpa-num { font-size: 24px; font-weight: 800; }
    .gpa-card.sgpa .gpa-num { color: #059669; }
    .gpa-card.cgpa .gpa-num { color: #2563eb; }
    .gpa-label { font-size: 9px; text-transform: uppercase; font-weight: 700; }
    
    .course-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #edf2f9; }
    .course-name { font-weight: 600; font-size: 13px; color: #0b1e33; }
    .course-code { font-size: 11px; color: #4f6885; }
    .course-grade { text-align: right; }
    .grade-letter { background: #1f8b4c; color: white; border-radius: 40px; font-size: 11px; padding: 2px 10px; font-weight: 700; display: inline-block; margin-left: 4px; }
    .course-pct { font-weight: 700; font-size: 13px; }
    
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      display: flex; justify-content: space-around; padding: 10px 12px 14px;
      background: #fafcff; border-top: 1px solid #e3eaf2; z-index: 9999;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: #5b718b; cursor: pointer; border: none; background: none; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: #0b1e33; }
    .nav-item.active i { color: #0b1e33; }
  </style>
</head>
<body>

<div class="app">
  <div class="banner">
    <img src="/images/banner.jpeg" alt="Banner">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="Logo">
      <div><div class="banner-title">Bahir Dar University</div><div class="banner-sub">Student Portal</div></div>
    </div>
  </div>
  
  <div class="header">
    <h1>Academic Results</h1>
    <button class="back-btn" onclick="location.href='/pages/dashboard.html'">← Back</button>
  </div>
  
  <div class="content" id="results-content"></div>
  
  <div class="bottom-nav">
    <button class="nav-item" onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</button>
    <button class="nav-item active"><i class="fas fa-list-ul"></i> Results</button>
    <button class="nav-item" onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</button>
    <button class="nav-item" onclick="location.href='/pages/profile.html'"><i class="fas fa-user"></i> Profile</button>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) { window.location.href = '/'; return; }
  var data = JSON.parse(saved);
  var regs = data.registrations || [];
  var courses = data.courses || [];
  
  var html = '';
  regs.forEach(function(reg) {
    var semCourses = courses.find(function(c) { return c.semester === reg.semester; });
    html += '<div class="semester-block">';
    html += '<div class="sem-title">Semester ' + reg.semester + ' (' + reg.acYear + ')</div>';
    html += '<div class="gpa-grid">';
    html += '<div class="gpa-card sgpa"><div class="gpa-num">' + reg.sgpa + '</div><div class="gpa-label">SGPA</div></div>';
    html += '<div class="gpa-card cgpa"><div class="gpa-num">' + reg.cgpa + '</div><div class="gpa-label">CGPA</div></div>';
    html += '</div>';
    if (semCourses && semCourses.courses) {
      semCourses.courses.forEach(function(c) {
        html += '<div class="course-row"><div><div class="course-name">' + c.title + '</div>';
        html += '<div class="course-code">' + c.code + ' · ' + c.credit + ' Cr</div></div>';
        html += '<div class="course-grade"><div class="course-pct">' + (c.percentage || '—') + '</div>';
        html += '<span class="grade-letter">' + c.grade + '</span></div></div>';
      });
    }
    html += '</div>';
  });
  document.getElementById('results-content').innerHTML = html;
})();
</script>
</body>
</html>
