<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDU Student Portal - Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .results-container { max-width: 420px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 40px -12px rgba(0,20,40,0.25); overflow: hidden; min-height: 100vh; }
        .results-screen { padding: 0 0 0.8rem 0; }
        .results-header { padding: 1.2rem 1.5rem 0.5rem; }
        .results-header .main-title { font-size: 1.5rem; font-weight: 700; color: #0b1e33; }
        .results-header .sub-year { color: #3e5772; font-weight: 500; font-size: 0.9rem; }
        .semester-toggle { display: flex; gap: 1.8rem; padding: 0.5rem 1.5rem 0.2rem; font-weight: 600; font-size: 0.95rem; }
        .semester-toggle .sem { color: #6e86a1; cursor: pointer; padding-bottom: 4px; transition: 0.2s; border-bottom: 3px solid transparent; }
        .semester-toggle .sem.active { color: #0b1e33; border-bottom: 3px solid #0b1e33; }
        .gpa-box { background: #f2f8ff; margin: 0.8rem 1.5rem 1.2rem; border-radius: 28px; padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .gpa-item .big { font-size: 1.8rem; font-weight: 800; color: #0b1e33; }
        .gpa-item .sm { font-size: 0.7rem; color: #3c5a78; font-weight: 600; }
        .gpa-item .badge { background: #1f8b4c; color: white; padding: 0.2rem 1rem; border-radius: 40px; font-size: 0.7rem; font-weight: 700; }
        .course-section-title { padding: 0 1.5rem 0.2rem; font-weight: 700; color: #0b1e33; font-size: 0.9rem; }
        .course-list { padding: 0 1.5rem 1rem; }
        .course-row { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 0; border-bottom: 1px solid #edf2f9; }
        .course-row:last-child { border-bottom: none; }
        .course-info .cname { font-weight: 600; color: #0b1e33; font-size: 0.95rem; }
        .course-info .ccode { font-size: 0.7rem; color: #4f6885; font-weight: 500; }
        .course-info .cred { font-size: 0.7rem; color: #4f6885; margin-left: 8px; }
        .course-grade { text-align: right; }
        .course-grade .score { font-weight: 700; color: #0b1e33; font-size: 1rem; }
        .course-grade .letter { background: #1f8b4c; color: white; border-radius: 40px; font-size: 0.7rem; padding: 0.1rem 0.8rem; font-weight: 700; margin-left: 6px; display: inline-block; }
        .course-grade .letter.incomplete { background: #6f8aa8; }
        .course-grade .pts { font-size: 0.7rem; color: #3e5f7e; font-weight: 500; }
        .print-btn { margin: 0.5rem 1.5rem 1rem; padding: 0.8rem; background: #1a5f9c; color: white; border: none; border-radius: 50px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>

<div class="results-container">
    <!-- Banner with logo -->
    <div class="banner-header" style="height:100px;">
        <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
        <div class="banner-overlay">
            <img src="/images/logo.jpg" alt="BDU Logo">
            <div>
                <div class="uni-name">Bahir Dar University</div>
                <div class="uni-sub">Student Portal</div>
            </div>
        </div>
    </div>

    <div class="portal-header">
        <h1><i class="fas fa-graduation-cap"></i> BDU Student Portal</h1>
        <span class="sub" onclick="location.href='/pages/dashboard.html'" style="cursor:pointer;"><i class="fas fa-arrow-left"></i> Back</span>
    </div>

    <div class="results-screen">
        <div class="results-header">
            <div class="main-title">Academic Results</div>
            <div class="sub-year" id="sub-year">2025/2026</div>
        </div>

        <div class="semester-toggle" id="semester-toggle"></div>

        <div class="gpa-box">
            <div class="gpa-item">
                <div class="big" id="semesterGpa">—</div>
                <div class="sm">Semester GPA</div>
            </div>
            <div class="gpa-item" style="text-align:center;">
                <span class="badge" id="statusBadge">—</span>
            </div>
            <div class="gpa-item" style="text-align:right;">
                <div class="big" id="cgpaDisplay">—</div>
                <div class="sm">CGPA</div>
            </div>
        </div>

        <div class="course-section-title">Course Results</div>
        <div class="course-list" id="courseList"></div>

        <button class="print-btn" onclick="location.href='/pages/grade-report.html'">
            <i class="fas fa-print"></i> Print Grade Report
        </button>

        <div class="bottom-nav">
            <span onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</span>
            <span class="active"><i class="fas fa-list-ul"></i> Results</span>
            <span onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</span>
            <span onclick="location.href='/pages/profile.html'"><i class="fas fa-user"></i> Profile</span>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/results.js"></script>
</body>
</html>
