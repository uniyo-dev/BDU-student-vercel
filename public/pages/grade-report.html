<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU - Grade Report</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    @page {
      size: A4;
      margin: 0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    
    body {
      background: #eef2f7;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: white;
      margin: 0 auto;
      padding: 10mm 8mm;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    @media print {
      body { background: white; }
      .a4-sheet {
        width: 100%;
        min-height: 100vh;
        box-shadow: none;
        margin: 0;
        padding: 0;
      }
      .no-print { display: none !important; }
    }
    
    .report-header {
      text-align: center;
      border-bottom: 2px solid #0b1e33;
      padding-bottom: 5px;
      margin-bottom: 8px;
    }
    
    .logo-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    
    .logo-row img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    
    .uni-name {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .report-title {
      font-size: 9px;
      font-weight: 700;
      color: #1a4b78;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .student-info {
      width: 100%;
      font-size: 8px;
      border-collapse: collapse;
      margin-bottom: 6px;
    }
    
    .student-info td {
      padding: 1px 3px;
    }
    
    .semester-header {
      background: #1a4b78;
      color: white;
      padding: 3px 6px;
      font-weight: 700;
      font-size: 8px;
      border-radius: 3px 3px 0 0;
      margin-top: 4px;
    }
    
    .grade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 7px;
    }
    
    .grade-table th {
      background: #0b1e33;
      color: white;
      padding: 2px 3px;
      font-size: 6px;
      text-align: left;
    }
    
    .grade-table td {
      padding: 1px 3px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .signature-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: absolute;
      bottom: 8mm;
      left: 8mm;
      right: 8mm;
    }
    
    .signature-box {
      text-align: center;
      font-size: 6px;
    }
    
    .signature-box img {
      width: 45px;
      height: 35px;
      object-fit: contain;
    }
    
    .stamp-box img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }
    
    .report-footer {
      position: absolute;
      bottom: 2mm;
      left: 8mm;
      right: 8mm;
      text-align: center;
      font-size: 5px;
      color: #4f647c;
      border-top: 1px solid #e2e8f0;
      padding-top: 2px;
    }
  </style>
</head>
<body>

  <div class="a4-sheet">
    <div class="report-header">
      <div class="logo-row">
        <img src="/images/logo.jpg" alt="Logo">
        <img src="/images/ethiopian_emblem.jpg" alt="Emblem" style="width:35px;height:35px;">
      </div>
      <div class="uni-name">Bahir Dar University</div>
      <div class="report-title">Official Grade Report</div>
    </div>
    
    <table class="student-info">
      <tr>
        <td style="width:15%;"><strong>Student:</strong></td>
        <td style="width:35%;" id="report-name"></td>
        <td style="width:10%;"><strong>ID:</strong></td>
        <td id="report-id"></td>
      </tr>
      <tr>
        <td><strong>Program:</strong></td>
        <td colspan="3" id="report-program"></td>
      </tr>
      <tr>
        <td><strong>Year:</strong></td>
        <td id="report-year"></td>
        <td><strong>Credits:</strong></td>
        <td id="report-total-credits"></td>
      </tr>
      <tr>
        <td><strong>CGPA:</strong></td>
        <td id="report-cgpa"></td>
        <td><strong>Status:</strong></td>
        <td id="report-status"></td>
      </tr>
    </table>
    
    <div id="report-content"></div>
    
    <div class="signature-area">
      <div class="signature-box">
        <img src="/images/Signature.png" alt="Signature">
        <div><strong>Registrar</strong></div>
      </div>
      <div class="signature-box stamp-box">
        <img src="/images/stamp.jpg" alt="Stamp">
        <div><strong>OFFICIAL STAMP</strong></div>
      </div>
      <div class="signature-box">
        <img src="/images/Signature.png" alt="Signature">
        <div><strong>Dean</strong></div>
      </div>
    </div>
    
    <div class="report-footer">
      Official document issued by Bahir Dar University
    </div>
  </div>
  
  <div class="no-print" style="text-align:center;padding:16px;">
    <button onclick="window.print()" style="padding:12px 24px;background:#1a5f9c;color:white;border:none;border-radius:50px;font-weight:700;font-size:14px;cursor:pointer;">
      <i class="fas fa-print"></i> Print / Save as PDF
    </button>
    <button onclick="location.href='/pages/results.html'" style="padding:12px 24px;background:#64748b;color:white;border:none;border-radius:50px;font-weight:700;font-size:14px;cursor:pointer;margin-left:8px;">
      <i class="fas fa-arrow-left"></i> Back
    </button>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/renderer-grade-report.js"></script>
</body>
</html>
