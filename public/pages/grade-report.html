<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU - Grade Report</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/print.css">
  <link rel="stylesheet" href="/css/utilities.css">
  
  <style>
    /* A4 EXACT FIT */
    @page {
      size: A4;
      margin: 0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      background: white;
      margin: 0 auto;
      padding: 15mm 12mm 10mm 12mm;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    
    /* Print - exact A4 */
    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }
      
      .a4-page {
        width: 100%;
        min-height: 100vh;
        box-shadow: none;
        margin: 0;
        padding: 0;
      }
      
      .no-print {
        display: none !important;
      }
    }
    
    /* Screen */
    @media screen {
      .a4-page {
        margin: 20px auto;
      }
    }
    
    /* Header */
    .report-header {
      text-align: center;
      border-bottom: 2px solid #0b1e33;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    
    .logo-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    
    .logo-row img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }
    
    .uni-name {
      font-size: 12px;
      font-weight: 800;
      color: #0b1e33;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .report-title {
      font-size: 10px;
      font-weight: 700;
      color: #1a4b78;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Student Info */
    .student-info {
      width: 100%;
      font-size: 9px;
      border-collapse: collapse;
      margin-bottom: 8px;
    }
    
    .student-info td {
      padding: 2px 4px;
      vertical-align: top;
    }
    
    /* Semester */
    .semester-header {
      background: #1a4b78;
      color: white;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 9px;
      border-radius: 3px 3px 0 0;
      margin-top: 6px;
    }
    
    /* Grade Table */
    .grade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8px;
    }
    
    .grade-table th {
      background: #0b1e33;
      color: white;
      padding: 3px 4px;
      font-size: 7px;
      text-align: left;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .grade-table td {
      padding: 2px 4px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .grade-table tr:nth-child(even) {
      background: #f8fafc;
    }
    
    /* Signature */
    .signature-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      padding-top: 10px;
      page-break-inside: avoid;
    }
    
    .signature-box {
      text-align: center;
      font-size: 7px;
    }
    
    .signature-box img {
      width: 55px;
      height: 40px;
      object-fit: contain;
      margin-bottom: 2px;
    }
    
    .stamp-box img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }
    
    /* Footer */
    .report-footer {
      text-align: center;
      font-size: 6px;
      color: #4f647c;
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- A4 Page -->
  <div class="a4-page" id="print-area">
    <!-- Header -->
    <div class="report-header">
      <div class="logo-row">
        <img src="/images/logo.jpg" alt="BDU Logo">
        <img src="/images/ethiopian_emblem.jpg" alt="Emblem" style="width:40px;height:40px;">
      </div>
      <div class="uni-name">Bahir Dar University</div>
      <div class="report-title">Official Grade Report</div>
    </div>
    
    <!-- Student Info -->
    <table class="student-info">
      <tr>
        <td style="width:18%;"><strong>Student:</strong></td>
        <td style="width:32%;" id="report-name"></td>
        <td style="width:12%;"><strong>ID:</strong></td>
        <td id="report-id"></td>
      </tr>
      <tr>
        <td><strong>Program:</strong></td>
        <td colspan="3" id="report-program"></td>
      </tr>
      <tr>
        <td><strong>Ac. Year:</strong></td>
        <td id="report-year"></td>
        <td><strong>Credits:</strong></td>
        <td id="report-total-credits"></td>
      </tr>
      <tr>
        <td><strong>CGPA:</strong></td>
        <td id="report-cgpa"></td>
        <td><strong>Status:</strong></td>
        <td id="report-status"></td>
      </tr>
    </table>
    
    <!-- Content -->
    <div id="report-content"></div>
    
    <!-- Signature -->
    <div class="signature-area">
      <div class="signature-box">
        <img src="/images/Signature.png" alt="Signature">
        <div><strong>Registrar</strong></div>
      </div>
      <div class="signature-box stamp-box">
        <img src="/images/stamp.jpg" alt="Stamp">
        <div><strong>OFFICIAL STAMP</strong></div>
      </div>
      <div class="signature-box">
        <img src="/images/Signature.png" alt="Signature">
        <div><strong>Dean</strong></div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="report-footer">
      Official document issued by Bahir Dar University. Verify at studentportal.bdu.edu.et
    </div>
  </div>
  
  <!-- Print Buttons (not printed) -->
  <div class="no-print" style="text-align:center;padding:16px;">
    <button class="print-btn" onclick="window.print()">
      <i class="fas fa-print"></i> Print / Save as PDF
    </button>
    <button class="print-btn" style="background:#64748b;margin-left:8px;" onclick="location.href='/pages/results.html'">
      <i class="fas fa-arrow-left"></i> Back
    </button>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/renderer-grade-report.js"></script>
</body>
</html>
