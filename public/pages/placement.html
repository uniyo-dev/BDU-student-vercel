<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>BDU Portal - Placement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared/variables.css">
  <link rel="stylesheet" href="/css/shared/theme.css">
  <link rel="stylesheet" href="/css/shared/reset.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/banner.css">
  <link rel="stylesheet" href="/css/shared/navigation.css">
  <link rel="stylesheet" href="/css/shared/animations.css">
  <link rel="stylesheet" href="/css/shared/utilities.css">
  <link rel="stylesheet" href="/css/placement/placement.css">
  <link rel="stylesheet" href="/css/placement/priorities.css">
<link rel="stylesheet" href="/css/shared/dropdown.css">
</head>
<body>

<div id="page-departments" class="page active">
  <div class="depts-header">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
      <button class="back-btn" onclick="location.href='/pages/dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <div style="font-size:20px;font-weight:800;">Department Placement</div>
        <div style="font-size:12px;opacity:0.75;margin-top:2px;">Select department to view students</div>
      </div>
    </div>
  </div>
  
  <!-- Tab switcher: Departments | Rankings -->
  <div class="tab-switcher">
    <button class="tab-switch-btn active" data-tab="departments" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="vertical-align:-3px;margin-right:6px;">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Departments
    </button>
    <button class="tab-switch-btn" data-tab="priorities" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="vertical-align:-3px;margin-right:6px;">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
      </svg>
      Priorities
    </button>
    <button class="tab-switch-btn" data-tab="rankings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="vertical-align:-3px;margin-right:6px;">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      Rankings
    </button>
  </div>

  <!-- ============ DEPARTMENTS TAB ============ -->
  <div id="tab-departments" class="tab-content">

  <!-- Department Tabs -->
  <div class="dept-tabs" id="dept-tabs"></div>
  
  <!-- Search -->
  <div class="search-wrap">
    <input type="text" class="search-input" id="search-input" placeholder="Search by name or ID..." onkeyup="searchStudents()">
  </div>
  
  <!-- Stats -->
  <div class="stats-bar" id="stats-bar"></div>
  
  <!-- Content -->
  <div class="depts-content" id="depts-content"></div>
  
  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
  </div><!-- /tab-departments -->

  <!-- ============ RANKINGS TAB ============ -->
  <div id="tab-rankings" class="tab-content hidden">
    <div class="rankings-content">
      <div id="position-section"></div>
      <div id="filter-section"></div>
      <div id="leaderboard-section"></div>
      <div id="priority-section"></div>
      <div id="criteria-section"></div>

      <div class="refresh-wrap">
        <button class="refresh-btn" id="btn-refresh" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Refresh Rankings
        </button>
      </div>
    </div>
  </div><!-- /tab-rankings -->

  <!-- ============ PRIORITIES TAB ============ -->
  <div id="tab-priorities" class="tab-content hidden">
    <div class="priorities-content" id="priorities-content">
      <!-- Rendered by priorities-controller.js -->
    </div>
  </div><!-- /tab-priorities -->
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='/pages/dashboard.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
  </button>
  <button class="nav-item" onclick="location.href='/pages/results.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    RESULTS
  </button>
  <button class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    PLACEMENT
  </button>
  <button class="nav-item" onclick="location.href='/pages/profile.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PROFILE
  </button>
</nav>

<!-- Shared JS -->
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/ui.js"></script>
<!-- Placement JS -->
<script src="/js/placement/placement.js"></script>
  <script src="/js/placement/priorities-controller.js"></script>

  <div style="margin-bottom:10px;">
    <a href="/" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Home</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/about.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">About</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/help.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Help</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/privacy.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Privacy</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/contact.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Contact</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/terms.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Terms</a>

    BD Buddy · Unofficial BDU Portal Viewer
  </div>
</div>
