  <title>BDU Portal - Placement</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/shared/theme.css">
  <link rel="stylesheet" href="/css/shared/reset.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/banner.css">

<body>

<div id="page-departments" class="page active">
  <div class="depts-header">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
      <button class="back-btn" onclick="location.href='/pages/dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <div style="font-size:20px;font-weight:800;">Department Placement</div>
        <div style="font-size:12px;opacity:0.75;margin-top:2px;">Select department to view students</div>
      </div>
    </div>
  </div>
  
  <!-- Tab switcher: Departments | Rankings -->
  <div class="tab-switcher">
    <button class="tab-switch-btn active" data-tab="departments" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="vertical-align:-3px;margin-right:6px;">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Departments
    </button>
    <button class="tab-switch-btn" data-tab="rankings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="vertical-align:-3px;margin-right:6px;">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      Rankings
    </button>
  </div>

  <!-- ============ DEPARTMENTS TAB ============ -->
  <div id="tab-departments" class="tab-content">

  <!-- Department Tabs -->
  <div class="dept-tabs" id="dept-tabs"></div>
  
  <!-- Search -->
  <div class="search-wrap">
    <input type="text" class="search-input" id="search-input" placeholder="Search by name or ID..." onkeyup="searchStudents()">
  </div>
  
  <!-- Stats -->
  <div class="stats-bar" id="stats-bar"></div>
  
  <!-- Content -->
  <div class="depts-content" id="depts-content"></div>
  
  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
  </div><!-- /tab-departments -->

  <!-- ============ RANKINGS TAB ============ -->
  <div id="tab-rankings" class="tab-content" style="display:none;">
    <div class="rankings-content">
      <div id="position-section"></div>
      <div id="leaderboard-section"></div>
      <div id="priority-section"></div>
      <div id="criteria-section"></div>

      <div class="refresh-wrap">
        <button class="refresh-btn" id="btn-refresh" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Refresh Rankings
        </button>
      </div>
    </div>
  </div><!-- /tab-rankings -->
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='/pages/dashboard.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
  </button>
  <button class="nav-item" onclick="location.href='/pages/results.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    RESULTS
  </button>
  <button class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    PLACEMENT
  </button>
  <button class="nav-item" onclick="location.href='/pages/profile.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PROFILE
  </button>
</nav>

<!-- Shared JS -->
<script src="/js/shared/config.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/ui.js"></script>
<!-- Placement JS -->
<script src="/js/placement/placement.js"></script>

  </div>

<!-- ============================================================
     Ranking Refresh Password Modal
     ============================================================ -->
<div id="ranking-modal" class="rank-modal">
  <div class="rank-modal-overlay" onclick="RankingModal.cancel()"></div>
  <div class="rank-modal-card">
    <div class="rank-modal-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="rank-modal-title" id="rank-modal-title">Refresh Rankings</div>
    <div class="rank-modal-sub" id="rank-modal-sub">Re-enter your BDU password to load the latest data.</div>

    <div class="rank-modal-input-wrap" id="rank-modal-input-wrap">
      <svg class="rank-modal-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="rank-modal-password" class="rank-modal-input"
             placeholder="Enter your BDU password" autocomplete="current-password" />
      <button type="button" class="rank-modal-input-toggle" onclick="RankingModal.togglePassword()">
        <svg id="rank-modal-eye-show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="rank-modal-eye-hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>

    <div class="rank-modal-error" id="rank-modal-error"></div>
    <div class="rank-modal-success" id="rank-modal-success"></div>

    <div class="rank-modal-actions" id="rank-modal-actions">
      <button type="button" class="rank-modal-btn rank-modal-btn-secondary" onclick="RankingModal.cancel()">Cancel</button>
      <button type="button" class="rank-modal-btn rank-modal-btn-primary" id="rank-modal-submit" onclick="RankingModal.submit()">Verify &amp; Refresh</button>
    </div>

    <div class="rank-modal-spinner" id="rank-modal-spinner" style="display:none;">
      <div class="rank-modal-spinner-ring"></div>
      <div class="rank-modal-spinner-text">Fetching latest data…</div>
    </div>
  </div>
</div>
<script src="/js/placement/rankings-controller.js"></script>
</body>
</html>
