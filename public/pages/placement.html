<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU Portal - Placement</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/banner.css">
  <link rel="stylesheet" href="/css/semester.css">
  <link rel="stylesheet" href="/css/gpa.css">
  <link rel="stylesheet" href="/css/courses.css">
  <link rel="stylesheet" href="/css/placement.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-container { height: 100vh; display: flex; flex-direction: column; }
    .scroll-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 70px; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 420px; width: 100%; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="banner-header">
    <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="BDU Logo">
      <div>
        <div class="uni-name">Bahir Dar University</div>
        <div class="uni-sub">Student Portal</div>
      </div>
    </div>
  </div>

  <div class="portal-header">
    <h1><i class="fas fa-graduation-cap"></i> BDU Student Portal</h1>
    <span class="sub" onclick="location.href='/pages/dashboard.html'"><i class="fas fa-arrow-left"></i> Back</span>
  </div>

  <div class="scroll-content" id="placement-scroll">
    <div id="placement-content"></div>
  </div>

  <div class="bottom-nav">
    <span onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</span>
    <span onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</span>
    <span class="active"><i class="fas fa-sitemap"></i> Placement</span>
    <span onclick="location.href='/pages/profile.html'"><i class="fas fa-user"></i> Profile</span>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) {
    window.location.href = '/';
    return;
  }
  var data = JSON.parse(saved);
  var placement = data.placement || {};
  var results = placement.results || [];
  var criteria = placement.criteria || [];
  
  var html = '';
  
  if (results.length > 0) {
    var selected = results.find(function(r) { return r.status === 'Selected'; }) || results[0];
    
    html += '<div class="semester-block semester-1">';
    html += '<div class="semester-title"><i class="fas fa-check-circle"></i> Placement Status</div>';
    html += '<div style="text-align:center;padding:16px;">';
    html += '<div style="font-size:20px;font-weight:800;color:#1a5f9c;">' + selected.department + '</div>';
    html += '<div style="font-size:13px;margin-top:4px;">Priority: ' + selected.priority + '</div>';
    html += '<div style="font-size:13px;">Score: ' + selected.totalScore + '</div>';
    html += '</div></div>';
    
    html += '<div class="gpa-grid">';
    results.forEach(function(r) {
      var isSel = r.status === 'Selected';
      html += '<div class="gpa-card ' + (isSel ? 'cgpa' : 'sgpa') + '">';
      html += '<div style="font-size:13px;font-weight:700;">' + r.department + '</div>';
      html += '<div style="font-size:11px;">' + r.priority + '</div>';
      html += '<div class="gpa-value" style="font-size:16px;">' + r.totalScore + '</div>';
      html += '<div class="gpa-label">' + r.status + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  
  if (criteria.length > 0) {
    html += '<div class="semester-block semester-2">';
    html += '<div class="semester-title"><i class="fas fa-list"></i> Placement Criteria</div>';
    criteria.forEach(function(c) {
      html += '<div class="course-row"><div class="course-info"><div class="cname">' + c.name + '</div>';
      html += '<div class="ccode">Weight: ' + c.percent + '%</div></div>';
      html += '<div class="course-grade"><span class="score">' + (c.scored || '—') + '</span></div></div>';
    });
    html += '</div>';
  }
  
  document.getElementById('placement-content').innerHTML = html;
})();
</script>
</body>
</html>
