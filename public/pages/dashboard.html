<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>BDU Portal - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared/variables.css">
  <link rel="stylesheet" href="/css/shared/theme.css">
  <link rel="stylesheet" href="/css/shared/reset.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/banner.css">
  <link rel="stylesheet" href="/css/shared/navigation.css">
  <link rel="stylesheet" href="/css/shared/animations.css">
  <link rel="stylesheet" href="/css/shared/utilities.css">
  <link rel="stylesheet" href="/css/dashboard/dashboard.css">
</head>
<body>

<div id="page-dashboard" class="page active">
  <div class="dash-header">
    <div class="dash-header-top">
      <div class="dash-brand">
        <div class="dash-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="dash-brand-label">BDU Portal</div>
          <div class="dash-brand-name">Student Portal</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
      <button id="bd-theme-toggle" class="bd-theme-toggle" type="button" aria-label="Toggle theme"></button>
      <button class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      </div>
    </div>
    <div class="dash-welcome-label">Welcome back,</div>
    <div class="dash-welcome-name" id="dash-name"></div>
  </div>

  <div class="dash-content">
    <div class="dash-program-card">
      <div class="dash-program-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <div>
        <div class="dash-program-title">Freshman Program</div>
        <div class="dash-program-desc" id="dash-program-desc"></div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div class="stat-label">Cumulative GPA</div>
        <div class="stat-value" id="dash-gpa">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div class="stat-label">Earned Credits</div>
        <div class="stat-value" id="dash-credits">0</div>
      </div>
    </div>

    <div class="student-id-row">
      <span class="student-id-label">Student ID:</span>
      <span class="student-id-badge" id="dash-student-id"></span>
    </div>

    <div class="section-title">Quick Links</div>
    <button class="quick-link" onclick="location.href='/pages/results.html'">
      <div class="quick-link-icon indigo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="quick-link-text">
        <h4>Semester Results</h4>
        <p>View your latest grades</p>
      </div>
      <div class="quick-link-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </button>
    <button class="quick-link" onclick="location.href='/pages/placement.html'">
      <div class="quick-link-icon amber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="quick-link-text">
        <h4>Department Placement</h4>
        <p>Check your placement status</p>
      </div>
      <div class="quick-link-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </button>
    <button class="quick-link" onclick="location.href='/pages/profile.html'">
      <div class="quick-link-icon indigo" style="background:#f0fdf4;color:#059669;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="quick-link-text">
        <h4>My Profile</h4>
        <p>Personal info</p>
      </div>
      <div class="quick-link-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
  </button>
  <button class="nav-item" onclick="location.href='/pages/results.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    RESULTS
  </button>
  <button class="nav-item" onclick="location.href='/pages/placement.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    PLACEMENT
  </button>
  <button class="nav-item" onclick="location.href='/pages/profile.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PROFILE
  </button>
</nav>

<!-- Shared JS -->
<script src="/js/shared/theme-toggle.js"></script>
<script src="/js/shared/config.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/ui.js"></script>
<!-- Dashboard JS -->
<script src="/js/dashboard/dashboard.js"></script>
<script src="/js/dashboard/renderer-dashboard.js"></script>

  <div style="margin-bottom:10px;">
    <a href="/pages/about.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">About</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/help.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Help</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/privacy.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Privacy</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/contact.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Contact</a>
    <span style="color:#cbd5e1;">·</span>
    <a href="/pages/terms.html" style="color:#2563eb;text-decoration:none;margin:0 8px;font-weight:600;">Terms</a>
  </div>
  <div style="color:#94a3b8;font-size:11px;">
    BD Buddy · Unofficial BDU Portal Viewer
  </div>
</div>

</body>
</html>
