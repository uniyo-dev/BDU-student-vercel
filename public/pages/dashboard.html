<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU Portal - Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/banner.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/semester.css">
  <link rel="stylesheet" href="/css/gpa.css">
  <link rel="stylesheet" href="/css/courses.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-container { height: 100vh; display: flex; flex-direction: column; }
    .scroll-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 70px; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 420px; width: 100%; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="banner-header">
    <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="BDU Logo">
      <div>
        <div class="uni-name">Bahir Dar University</div>
        <div class="uni-sub">Student Portal</div>
      </div>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>

  <div class="scroll-content">
    <div class="welcome-area">
      <div class="greeting">Welcome back,</div>
      <div class="student-name" id="dash-name">Student</div>
      <div class="info-chip" id="dash-program">Loading...</div>
      <div class="student-id-display" id="dash-id"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="num" id="dash-gpa">—</div>
        <div class="label">Cumulative GPA</div>
      </div>
      <div class="stat-box">
        <div class="num" id="dash-credits">0</div>
        <div class="label">Earned Credits</div>
      </div>
    </div>

    <div class="quick-links">
      <div class="ql-title">Quick Links</div>
      <div class="link-card" onclick="location.href='/pages/results.html'">
        <div class="icon-wrap blue"><i class="fas fa-chart-simple"></i></div>
        <div><div class="ltext">Semester Results</div><div class="ldesc">View grades</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="link-card" onclick="location.href='/pages/placement.html'">
        <div class="icon-wrap amber"><i class="fas fa-building-columns"></i></div>
        <div><div class="ltext">Department Placement</div><div class="ldesc">Check status</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="link-card" onclick="location.href='/pages/profile.html'">
        <div class="icon-wrap purple"><i class="fas fa-user"></i></div>
        <div><div class="ltext">My Profile</div><div class="ldesc">Personal info</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="link-card" onclick="location.href='/pages/grade-report.html'">
        <div class="icon-wrap green"><i class="fas fa-print"></i></div>
        <div><div class="ltext">Grade Report</div><div class="ldesc">Print A4</div></div>
        <span class="arrow">›</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <span class="active"><i class="fas fa-chart-pie"></i> Dashboard</span>
    <span onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</span>
    <span onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</span>
    <span onclick="location.href='/pages/profile.html'"><i class="fas fa-user"></i> Profile</span>
  </div>
</div>

<script>
function logout() {
  sessionStorage.clear();
  window.location.href = '/';
}

(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) {
    window.location.href = '/';
    return;
  }
  var data = JSON.parse(saved);
  var bio = data.biography || {};
  var summary = data.summary || {};
  
  document.getElementById('dash-name').textContent = bio.fullName || 'Student';
  document.getElementById('dash-program').textContent = data.program || '';
  document.getElementById('dash-id').textContent = bio.studentId ? 'ID: ' + bio.studentId : '';
  document.getElementById('dash-gpa').textContent = summary.cumulativeGPA || '—';
  document.getElementById('dash-credits').textContent = summary.totalCredits || '0';
})();
</script>
</body>
</html>
