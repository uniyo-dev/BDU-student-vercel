<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BDU Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: white; }
    
    .app { width: 100vw; height: 100vh; height: 100dvh; background: white; display: flex; flex-direction: column; }
    
    .banner { width: 100%; height: 120px; position: relative; flex-shrink: 0; }
    .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .banner-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 25px 16px 10px;
      background: linear-gradient(transparent, rgba(11,30,51,0.9));
      color: white; display: flex; align-items: center; gap: 10px;
    }
    .banner-overlay img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    .banner-title { font-size: 14px; font-weight: 700; }
    .banner-sub { font-size: 10px; opacity: 0.8; }
    
    .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
    
    .welcome { padding: 16px 0; }
    .greeting { font-size: 14px; color: #3d536b; }
    .student-name { font-size: 24px; font-weight: 800; color: #0b1e33; margin-top: 2px; }
    .student-id { font-size: 12px; color: #64748b; margin-top: 4px; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-box {
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      border: 2px solid #93c5fd; border-radius: 16px;
      padding: 16px; text-align: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .stat-box.green {
      background: linear-gradient(135deg, #d1fae5, #ecfdf5);
      border: 2px solid #6ee7b7;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.15);
    }
    .stat-num { font-size: 28px; font-weight: 800; color: #2563eb; }
    
    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #f0f4fa 25%, #e0e8f0 50%, #f0f4fa 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-text { height: 16px; margin: 4px 0; }
    .skeleton-num { height: 28px; width: 60px; margin: 0 auto; }
    
    /* Dean's List Ribbon */
    /* Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 9999;
      pointer-events: none;
      animation: confettiFall 3s ease-in forwards;
    }
    
    @keyframes confettiFall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    
    /* Student Name Watermark */
    .name-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 60px;
      font-weight: 900;
      color: rgba(26, 95, 156, 0.04);
      pointer-events: none;
      z-index: 1;
      letter-spacing: 5px;
      white-space: nowrap;
      text-transform: uppercase;
    }
    
    .ribbon {
      display: inline-block; padding: 6px 16px;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: white; border-radius: 40px;
      font-size: 11px; font-weight: 800;
      letter-spacing: 0.5px; margin-top: 4px;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .ribbon.gold { background: linear-gradient(135deg, #fbbf24, #b45309); }
    .ribbon.silver { background: linear-gradient(135deg, #e2e8f0, #94a3b8); }
    .stat-label { font-size: 10px; color: #2563eb; text-transform: uppercase; font-weight: 700; margin-top: 4px; }
    
    .links { display: flex; flex-direction: column; gap: 10px; }
    .link-card {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid #e3eaf2; border-radius: 14px;
      padding: 14px 16px; cursor: pointer;
    }
    .link-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .link-icon.blue { background: #dbeafe; color: #1e40af; }
    .link-icon.amber { background: #fef3c7; color: #92400e; }
    .link-icon.purple { background: #ede9fe; color: #5b21b6; }
    .link-text { font-weight: 700; font-size: 14px; color: #0b1e33; }
    .link-sub { font-size: 11px; color: #64748b; }
    
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      display: flex; justify-content: space-around;
      padding: 10px 12px 14px;
      background: #fafcff; border-top: 1px solid #e3eaf2; z-index: 9999;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; color: #5b718b; cursor: pointer;
      border: none; background: none;
    }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: #0b1e33; }
    .nav-item.active i { color: #0b1e33; }
  </style>
</head>
<body>

<div class="app">
  <div class="banner">
    <img src="/images/banner.jpeg" alt="Banner">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="Logo">
      <div>
        <div class="banner-title">Bahir Dar University</div>
        <div class="banner-sub">Student Portal</div>
      </div>
    </div>
  </div>
  
  <!-- Student Name Watermark -->
<div class="name-watermark" id="name-watermark"></div>

<!-- Confetti Container -->
<div id="confetti-container"></div>

<div class="content">
    <div class="welcome">
      <div class="greeting">Welcome back,</div>
      <div class="student-name" id="dash-name">Student</div>
      <div class="student-id" id="dash-id"></div>
    <div id="dash-ribbon"></div>
    </div>
    
    <div class="stats">
      <div class="stat-box">
        <div class="stat-num" id="dash-gpa"><div class="skeleton skeleton-num"></div></div>
        <div class="stat-label">GPA</div>
      </div>
      <div class="stat-box green">
        <div class="stat-num" id="dash-credits" style="color: #059669;"><div class="skeleton skeleton-num"></div></div>
        <div class="stat-label">Credits</div>
      </div>
    </div>
    
    <div class="links">
      <div class="link-card" onclick="location.href='/pages/results.html'">
        <div class="link-icon blue"><i class="fas fa-chart-simple"></i></div>
        <div><div class="link-text">Results</div><div class="link-sub">View grades</div></div>
      </div>
      <div class="link-card" onclick="location.href='/pages/placement.html'">
        <div class="link-icon amber"><i class="fas fa-building-columns"></i></div>
        <div><div class="link-text">Placement</div><div class="link-sub">Check status</div></div>
      </div>
      <div class="link-card" onclick="location.href='/pages/profile.html'">
        <div class="link-icon purple"><i class="fas fa-user"></i></div>
        <div><div class="link-text">Profile</div><div class="link-sub">Personal info</div></div>
      </div>
    </div>
  </div>
  
  <div class="bottom-nav">
    <button class="nav-item active"><i class="fas fa-chart-pie"></i> Dashboard</button>
    <button class="nav-item" onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</button>
    <button class="nav-item" onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</button>
    <button class="nav-item" onclick="location.href='/pages/profile.html'"><i class="fas fa-user"></i> Profile</button>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) { window.location.href = '/'; return; }
  var data = JSON.parse(saved);
  var bio = data.biography || {};
  var summary = data.summary || {};
  document.getElementById('dash-name').textContent = bio.fullName || 'Student';
  document.getElementById('dash-id').textContent = bio.studentId ? 'ID: ' + bio.studentId : '';
  var gpa = summary.cumulativeGPA || '—';
  document.getElementById('dash-gpa').textContent = gpa;
  document.getElementById('dash-credits').textContent = summary.totalCredits || '0';
  
  // Add Dean's List ribbon if GPA is 4.00
  var ribbon = document.getElementById('dash-ribbon');
  if (gpa === '4.00') {
    ribbon.innerHTML = '<span class="ribbon gold">🏆 DEAN'S LIST - PERFECT 4.00</span>';
  } else if (parseFloat(gpa) >= 3.75) {
    ribbon.innerHTML = '<span class="ribbon silver">⭐ EXCELLENT PERFORMANCE</span>';
  }
})();
function launchConfetti() {
  var container = document.getElementById('confetti-container');
  var colors = ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#a78bfa', '#f87171'];
  
  for (var i = 0; i < 50; i++) {
    setTimeout(function() {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDuration = (2 + Math.random() * 2) + 's';
      container.appendChild(piece);
      
      // Remove after animation
      setTimeout(function() {
        piece.remove();
      }, 4000);
    }, i * 100);
  }
}
</script>
</body>
</html>
