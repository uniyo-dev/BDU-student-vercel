  <div class="portal-header">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:-3px;display:inline-block;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> BDU Student Portal</h1>

    <span onclick="location.href='/pages/results.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;display:inline-block;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Results</span>

    <span class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;display:inline-block;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> Rankings</span>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) {
    window.location.href = '/';
    return;
  }
  
  var data = JSON.parse(saved);
  var allStudents = data.placement?.allStudents || [];
  
  if (allStudents.length > 0) {
    var html = '<div style="font-weight:700;font-size:18px;margin-bottom:12px;">Placement Rankings</div>';
    
    allStudents.forEach(function(student, index) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;background:white;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #e3eaf2;">';
      html += '<div style="display:flex;align-items:center;gap:10px;">';
      html += '<div style="font-weight:800;color:#1a5f9c;width:24px;">' + (index + 1) + '</div>';
      html += '<div><div style="font-weight:600;">' + (student.fullName || '') + '</div>';
      html += '<div style="font-size:11px;color:#64748b;">' + (student.studentId || '') + '</div></div></div>';
      html += '<div style="text-align:right;"><div style="font-weight:700;">' + (student.department || '') + '</div>';
      html += '<div style="font-size:11px;color:#64748b;">' + (student.totalScore || '') + '</div></div>';
      html += '</div>';
    });
    
    document.getElementById('rankings-content').innerHTML = html;
  }
})();
</script>
