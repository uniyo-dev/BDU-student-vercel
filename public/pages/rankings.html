<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU Portal - Rankings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-container">
  <div class="banner-header">
    <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="BDU Logo">
      <div>
        <div class="uni-name">Bahir Dar University</div>
        <div class="uni-sub">Student Portal</div>
      </div>
    </div>
  </div>

  <div class="portal-header">
    <h1><i class="fas fa-graduation-cap"></i> BDU Student Portal</h1>
    <span class="sub" onclick="location.href='/pages/dashboard.html'"><i class="fas fa-arrow-left"></i> Back</span>
  </div>

  <div id="rankings-content" style="padding:16px;">
    <div style="text-align:center;padding:40px;color:#4a637f;">
      Rankings will appear here when placement results are released.
    </div>
  </div>

  <div class="bottom-nav">
    <span onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</span>
    <span onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</span>
    <span onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</span>
    <span class="active"><i class="fas fa-trophy"></i> Rankings</span>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) {
    window.location.href = '/';
    return;
  }
  
  var data = JSON.parse(saved);
  var allStudents = data.placement?.allStudents || [];
  
  if (allStudents.length > 0) {
    var html = '<div style="font-weight:700;font-size:18px;margin-bottom:12px;">Placement Rankings</div>';
    
    allStudents.forEach(function(student, index) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;background:white;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #e3eaf2;">';
      html += '<div style="display:flex;align-items:center;gap:10px;">';
      html += '<div style="font-weight:800;color:#1a5f9c;width:24px;">' + (index + 1) + '</div>';
      html += '<div><div style="font-weight:600;">' + (student.fullName || '') + '</div>';
      html += '<div style="font-size:11px;color:#64748b;">' + (student.studentId || '') + '</div></div></div>';
      html += '<div style="text-align:right;"><div style="font-weight:700;">' + (student.department || '') + '</div>';
      html += '<div style="font-size:11px;color:#64748b;">' + (student.totalScore || '') + '</div></div>';
      html += '</div>';
    });
    
    document.getElementById('rankings-content').innerHTML = html;
  }
})();
</script>
</body>
</html>
