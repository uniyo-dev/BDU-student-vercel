<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BDU Portal - Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: white; }
    .app { width: 100vw; height: 100vh; height: 100dvh; background: white; display: flex; flex-direction: column; }
    
    .banner { width: 100%; height: 100px; position: relative; flex-shrink: 0; }
    .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .banner-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 25px 16px 10px;
      background: linear-gradient(transparent, rgba(11,30,51,0.9));
      color: white; display: flex; align-items: center; gap: 10px;
    }
    .banner-overlay img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    .banner-title { font-size: 13px; font-weight: 700; }
    .banner-sub { font-size: 10px; opacity: 0.8; }
    
    .header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e3eaf2; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 700; color: #0b1e33; }
    .back-btn { font-size: 13px; color: #1a5f9c; cursor: pointer; background: #f0f4fa; padding: 6px 14px; border-radius: 40px; border: none; }
    
    .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
    
    .card {
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      border: 2px solid #93c5fd;
    }
    .card.personal {
      background: linear-gradient(135deg, #ede9fe, #faf5ff);
      border: 2px solid #c4b5fd;
    }
    .card-title { font-size: 15px; font-weight: 800; color: #1a5f9c; margin-bottom: 12px; }
    .card.personal .card-title { color: #7c3aed; }
    
    .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #edf2f9; }
    .row:last-child { border-bottom: none; }
    .label { font-size: 13px; color: #64748b; }
    .value { font-size: 13px; font-weight: 600; color: #0b1e33; text-align: right; }
    
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .chip { background: #d1fae5; color: #065f46; padding: 4px 14px; border-radius: 40px; font-size: 12px; font-weight: 600; }
    .chip.blue { background: #dbeafe; color: #1e40af; }
    
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      display: flex; justify-content: space-around; padding: 10px 12px 14px;
      background: #fafcff; border-top: 1px solid #e3eaf2; z-index: 9999;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: #5b718b; cursor: pointer; border: none; background: none; }
    .nav-item i { font-size: 20px; }
    .nav-item.active { color: #0b1e33; }
    .nav-item.active i { color: #0b1e33; }
  </style>
</head>
<body>

<div class="app">
  <div class="banner">
    <img src="/images/banner.jpeg" alt="Banner">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="Logo">
      <div><div class="banner-title">Bahir Dar University</div><div class="banner-sub">Student Portal</div></div>
    </div>
  </div>
  
  <div class="header">
    <h1>Profile</h1>
    <button class="back-btn" onclick="location.href='/pages/dashboard.html'">← Back</button>
  </div>
  
  <div class="content" id="profile-content"></div>
  
  <div class="bottom-nav">
    <button class="nav-item" onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</button>
    <button class="nav-item" onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</button>
    <button class="nav-item" onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</button>
    <button class="nav-item active"><i class="fas fa-user"></i> Profile</button>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  if (!saved) { window.location.href = '/'; return; }
  var data = JSON.parse(saved);
  var bio = data.biography || {};
  
  var html = '';
  html += '<div class="card"><div class="card-title">' + (bio.fullName || 'Student') + '</div>';
  html += '<div class="chips"><span class="chip">' + (bio.gender || '—') + '</span>';
  html += '<span class="chip blue">' + (bio.nationality || '—') + '</span></div></div>';
  
  html += '<div class="card"><div class="card-title">Academic Biography</div>';
  html += row('Program', data.program);
  html += row('Enrollment', bio.enrollmentDate);
  html += row('Stream', bio.highSchoolStream);
  html += '</div>';
  
  html += '<div class="card personal"><div class="card-title">Personal Biography</div>';
  html += row('Full Name', bio.fullName);
  html += row('Student ID', bio.studentId);
  html += row('Gender', bio.gender);
  html += row('Birth Date', bio.birthDate);
  html += row('Nationality', bio.nationality);
  html += row('Phone', bio.phone);
  html += row('Email', bio.email || '—');
  html += '</div>';
  
  document.getElementById('profile-content').innerHTML = html;
  
  function row(label, value) {
    if (!value || value === 'null') return '';
    return '<div class="row"><span class="label">' + label + '</span><span class="value">' + value + '</span></div>';
  }
})();
</script>
</body>
</html>
