<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>BDU Portal - Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared/variables.css">
  <link rel="stylesheet" href="/css/shared/reset.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/banner.css">
  <link rel="stylesheet" href="/css/shared/navigation.css">
  <link rel="stylesheet" href="/css/shared/animations.css">
  <link rel="stylesheet" href="/css/shared/utilities.css">
  <link rel="stylesheet" href="/css/profile/profile.css">
  <style>
    #page-profile { background: #f8fafc; padding-bottom: 96px; }
    .profile-header {
      background: linear-gradient(135deg, #334155, #1e293b);
      color: white; padding: 48px 20px 64px;
    }
    .back-btn {
      width: 36px; height: 36px; background: rgba(255,255,255,0.15);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: white;
    }
    .back-btn svg { width: 20px; height: 20px; }
    .profile-avatar-wrap { display: flex; flex-direction: column; align-items: center; }
    .profile-avatar {
      width: 84px; height: 84px; background: linear-gradient(135deg, #2563eb, #1e40af);
      border-radius: 22px; display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800; color: white; margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .profile-name { font-size: 22px; font-weight: 800; text-align: center; }
    .profile-id-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 500;
    }
    .profile-id-badge svg { width: 16px; height: 16px; }
    .profile-content { padding: 0 16px; margin-top: -20px; }
    .profile-section-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 12px; padding: 0 4px; }
    .profile-card {
      background: white; border-radius: 18px; border: 1px solid #f1f5f9;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 4px 0; margin-bottom: 24px;
    }
    .profile-row {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; border-bottom: 1px solid #f8fafc;
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-row-icon {
      width: 36px; height: 36px; background: #f8fafc; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .profile-row-icon svg { width: 18px; height: 18px; color: #94a3b8; }
    .profile-row-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .profile-row-value { font-size: 14px; font-weight: 700; color: #0f172a; margin-top: 2px; }
  </style>
</head>
<body>

<div id="page-profile" class="page active">
  <div class="profile-header">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <button class="back-btn" onclick="location.href='/pages/dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;">My Profile</div>
    </div>
    <div class="profile-avatar-wrap">
      <div class="profile-avatar" id="profile-avatar-initials"></div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-id-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="profile-student-id"></span>
      </div>
    </div>
  </div>
  <div class="profile-content" id="profile-content"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='/pages/dashboard.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
  </button>
  <button class="nav-item" onclick="location.href='/pages/results.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    RESULTS
  </button>
  <button class="nav-item" onclick="location.href='/pages/placement.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    PLACEMENT
  </button>
  <button class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PROFILE
  </button>
</nav>

<!-- Shared JS -->
<script src="/js/shared/config.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/ui.js"></script>
<!-- Profile JS -->
<script src="/js/profile/profile.js"></script>
<script src="/js/profile/renderer-profile.js"></script>
</body>
</html>
