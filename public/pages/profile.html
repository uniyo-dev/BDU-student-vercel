<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDU Portal - Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/banner.css">
  <link rel="stylesheet" href="/css/semester.css">
  <link rel="stylesheet" href="/css/gpa.css">
  <link rel="stylesheet" href="/css/courses.css">
  <link rel="stylesheet" href="/css/profile.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-container { height: 100vh; display: flex; flex-direction: column; }
    .scroll-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 0 70px; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 420px; width: 100%; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="banner-header">
    <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
    <div class="banner-overlay">
      <img src="/images/logo.jpg" alt="BDU Logo">
      <div>
        <div class="uni-name">Bahir Dar University</div>
        <div class="uni-sub">Student Portal</div>
      </div>
    </div>
  </div>

  <div class="portal-header">
    <h1><i class="fas fa-graduation-cap"></i> BDU Student Portal</h1>
    <span class="sub" onclick="location.href='/pages/dashboard.html'"><i class="fas fa-arrow-left"></i> Back</span>
  </div>

  <div class="scroll-content" id="profile-scroll">
    <div id="profile-content"></div>
  </div>

  <div class="bottom-nav">
    <span onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</span>
    <span onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</span>
    <span onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</span>
    <span class="active"><i class="fas fa-user"></i> Profile</span>
  </div>
</div>

<script>
(function() {
  var saved = sessionStorage.getItem('bdu_student_data');
  var container = document.getElementById('profile-content');
  
  if (!saved) {
    window.location.href = '/';
    return;
  }
  
  var data = JSON.parse(saved);
  var bio = data.biography || {};
  
  var html = '';
  
  // Profile Header Card
  html += '<div class="semester-block semester-1">';
  html += '<div class="semester-title"><i class="fas fa-user-graduate"></i> ' + (bio.fullName || 'Student') + '</div>';
  html += '<div style="text-align:center;padding:12px;">';
  html += '<span class="status-badge pass" style="font-size:14px;padding:6px 20px;">' + (bio.studentId || '') + '</span>';
  html += '</div></div>';
  
  // Gender & Nationality
  html += '<div class="gpa-grid">';
  html += '<div class="gpa-card sgpa"><div class="gpa-value">' + (bio.gender || '—') + '</div><div class="gpa-label">Gender</div></div>';
  html += '<div class="gpa-card cgpa"><div class="gpa-value" style="font-size:14px;">' + (bio.nationality || '—') + '</div><div class="gpa-label">Nationality</div></div>';
  html += '</div>';
  
  // Academic Biography
  html += '<div class="semester-block semester-1">';
  html += '<div class="semester-title"><i class="fas fa-book-open"></i> Academic Biography</div>';
  html += detailRow('Program', data.program);
  html += detailRow('Enrollment Date', bio.enrollmentDate);
  html += detailRow('High School Stream', bio.highSchoolStream);
  html += '</div>';
  
  // Personal Biography
  html += '<div class="semester-block semester-2">';
  html += '<div class="semester-title"><i class="fas fa-user"></i> Personal Biography</div>';
  html += detailRow('Full Name', bio.fullName);
  html += detailRow('Student ID', bio.studentId);
  html += detailRow('Gender', bio.gender);
  html += detailRow('Birth Date', bio.birthDate);
  html += detailRow('Nationality', bio.nationality);
  html += detailRow('Phone', bio.phone);
  html += detailRow('Email', bio.email || '—');
  html += detailRow('Birth Woreda', bio.birthWoreda || bio.woreda);
  html += '</div>';
  
  container.innerHTML = html;
  
  function detailRow(label, value) {
    if (!value || value === 'null' || value === 'undefined' || value === '') return '';
    return '<div class="course-row">' +
      '<div class="course-info"><div class="ccode">' + label + '</div></div>' +
      '<div class="course-grade"><span class="score">' + value + '</span></div>' +
      '</div>';
  }
})();
</script>
</body>
</html>
