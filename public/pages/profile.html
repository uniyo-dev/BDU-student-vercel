<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDU Portal - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-container">
    <div class="banner-header" style="height:100px;">
        <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
        <div class="banner-overlay">
            <img src="/images/logo.jpg" alt="BDU Logo">
            <div>
                <div class="uni-name">Bahir Dar University</div>
                <div class="uni-sub">Student Portal</div>
            </div>
        </div>
    </div>

    <div class="portal-header">
        <h1><i class="fas fa-graduation-cap"></i> BDU Student Portal</h1>
        <span class="sub" onclick="location.href='/pages/dashboard.html'" style="cursor:pointer;"><i class="fas fa-arrow-left"></i> Back</span>
    </div>

    <div class="profile-screen">
        <div class="profile-header">
            <div class="name" id="profile-name">Student Name</div>
            <div class="id" id="profile-id"><i class="far fa-id-badge"></i> —</div>
        </div>

        <div class="profile-section">
            <div class="section-title"><i class="fas fa-book-open" style="margin-right:8px;"></i> Academic Info</div>
            <div class="profile-row">
                <span class="label">Program</span>
                <span class="value" id="profile-program">—</span>
            </div>
            <div class="profile-row">
                <span class="label">Enrollment Date</span>
                <span class="value" id="profile-enrollment">—</span>
            </div>
            <div class="profile-row">
                <span class="label">High School Stream</span>
                <span class="value" id="profile-stream">—</span>
            </div>
        </div>

        <div class="profile-section">
            <div class="section-title"><i class="fas fa-user" style="margin-right:8px;"></i> Personal Info</div>
            <div class="profile-row">
                <span class="label">Gender</span>
                <span class="value" id="profile-gender">—</span>
            </div>
            <div class="profile-row">
                <span class="label">Birth Date</span>
                <span class="value" id="profile-birth">—</span>
            </div>
            <div class="profile-row">
                <span class="label">Nationality</span>
                <span class="value" id="profile-nationality">—</span>
            </div>
            <div class="profile-row">
                <span class="label">Phone</span>
                <span class="value" id="profile-phone">—</span>
            </div>
            <div class="profile-row">
                <span class="label">Email</span>
                <span class="value" id="profile-email">—</span>
            </div>
        </div>

        <div class="bottom-nav">
            <span onclick="location.href='/pages/dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</span>
            <span onclick="location.href='/pages/results.html'"><i class="fas fa-list-ul"></i> Results</span>
            <span onclick="location.href='/pages/placement.html'"><i class="fas fa-sitemap"></i> Placement</span>
            <span class="active"><i class="fas fa-user"></i> Profile</span>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
