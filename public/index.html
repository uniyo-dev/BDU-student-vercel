<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bahir Dar University Student Portal">
  <title>BDU Student Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    body {
      background: white;
    }
    
    .app {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: white;
      display: flex;
      flex-direction: column;
    }
    
    .banner {
      width: 100%;
      height: 180px;
      position: relative;
      flex-shrink: 0;
    }
    
    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .banner-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 20px 15px;
      background: linear-gradient(transparent, rgba(11,30,51,0.9));
      color: white;
      text-align: center;
    }
    
    .banner-title { font-size: 18px; font-weight: 700; }
    .banner-sub { font-size: 12px; opacity: 0.8; margin-top: 3px; }
    
    .login-area {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 3px solid #e0e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: block;
    }
    
    .form-group { margin-bottom: 16px; }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1f334a;
      margin-bottom: 6px;
    }
    
    .form-input {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid #d9e0e9;
      border-radius: 60px;
      font-size: 16px;
      background: #f9fbfd;
      transition: 0.2s;
    }
    
    .form-input:focus {
      border-color: #1a5f9c;
      outline: none;
      background: white;
      box-shadow: 0 0 0 3px rgba(26, 95, 156, 0.15);
    }
    
    .login-btn {
      width: 100%;
      padding: 15px;
      background: #0b1e33;
      color: white;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { opacity: 0.7; }
    
    .secure-note {
      margin-top: 16px;
      font-size: 12px;
      color: #4f647c;
      text-align: center;
    }
    
    .login-error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: 500;
    }
    
    .login-error.show { display: block; }
  </style>
</head>
<body>

<div class="app">
  <div class="banner">
    <img src="/images/banner.jpeg" alt="Banner">
    <div class="banner-overlay">
      <div class="banner-title">Bahir Dar University</div>
      <div class="banner-sub">Student Portal</div>
    </div>
  </div>
  
  <div class="login-area">
    <img src="/images/logo.jpg" alt="Logo" class="logo">
    
    <div id="login-error" class="login-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Portal Username</label>
        <input type="text" id="login-username" class="form-input" placeholder="e.g. bdu10460670" autocomplete="username" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <i class="fas fa-arrow-right-to-bracket"></i> 
        <span id="login-btn-text">Login to Portal</span>
      </button>
    </form>

    <div class="secure-note">
      Securely connects to studentportal.bdu.edu.et
    </div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var username = document.getElementById('login-username').value.trim();
  var password = document.getElementById('login-password').value;
  var errorDiv = document.getElementById('login-error');
  errorDiv.classList.remove('show');
  
  var btn = document.getElementById('login-btn');
  var btnText = document.getElementById('login-btn-text');
  btn.disabled = true;
  btnText.textContent = 'Logging in...';
  
  try {
    var response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    });
    var data = await response.json();
    
    if (data.success) {
      sessionStorage.setItem('bdu_logged_in', 'true');
      sessionStorage.setItem('bdu_username', username);
      sessionStorage.setItem('bdu_student_data', JSON.stringify(data.data));
      window.location.href = '/pages/dashboard.html';
    } else {
      errorDiv.textContent = data.error || 'Invalid credentials';
      errorDiv.classList.add('show');
    }
  } catch (error) {
    errorDiv.textContent = 'Login failed';
    errorDiv.classList.add('show');
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Login to Portal';
  }
});
</script>
</body>
</html>
