<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bahir Dar University Student Portal">
  <title>BDU Student Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/shared/variables.css">
  <link rel="stylesheet" href="/css/shared/reset.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/banner.css">
  <link rel="stylesheet" href="/css/shared/animations.css">
  <link rel="stylesheet" href="/css/shared/utilities.css">
  <link rel="stylesheet" href="/css/login/login.css">
</head>
<body>

<div class="app">
  <div class="banner">
    <img src="/images/banner.jpeg" alt="Banner">
    <div class="banner-overlay">
      <div class="banner-title">Bahir Dar University</div>
      <div class="banner-sub">Student Portal</div>
    </div>
  </div>
  
  <div class="login-area">
    <img src="/images/logo.jpg" alt="Logo" class="logo">
    
    <div id="login-error" class="login-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Portal Username</label>
        <input type="text" id="login-username" class="form-input" placeholder="e.g. bdu10460670" autocomplete="username" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <i class="fas fa-arrow-right-to-bracket"></i> 
        <span id="login-btn-text">Login to Portal</span>
      </button>
    </form>

    <div class="secure-note">
      Securely connects to studentportal.bdu.edu.et
    </div>
  </div>
</div>

<script src="/js/shared/config.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/store.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/login/login-handler.js"></script>
</body>
</html>
