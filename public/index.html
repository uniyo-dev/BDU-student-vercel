<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bahir Dar University Student Portal - Check academic results, GPA, and department placement">
  <title>BDU Student Portal - Login</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/banner.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/utilities.css">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/logo.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-content">
      <img src="/images/logo.jpg" alt="BDU Logo" class="splash-logo">
      <div class="splash-title">Bahir Dar University</div>
      <div class="splash-subtitle">Student Portal</div>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container">
    <!-- Banner -->
    <div class="banner-header">
      <img src="/images/banner.jpeg" alt="BDU Banner" class="banner-img">
      <div class="banner-overlay">
        <div class="uni-name">Bahir Dar University</div>
        <div class="uni-sub">Student Portal (26/27)</div>
      </div>
    </div>

    <!-- Login Form -->
    <div class="login-screen">
      <img src="/images/logo.jpg" alt="BDU Logo" class="logo-large">
      
      <div id="login-error" class="login-error"></div>
      
      <form id="login-form">
        <label for="username">Portal Username</label>
        <input type="text" id="login-username" placeholder="e.g. bdu10460670" autocomplete="username" required>
        
        <label for="password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
        
        <button type="submit" class="login-btn" id="login-btn">
          <i class="fas fa-arrow-right-to-bracket"></i>
          <span id="login-btn-text">Login to Portal</span>
          <span id="login-btn-spinner" class="spinner hidden"></span>
        </button>
      </form>
      
      <div class="secure-note">
        <i class="fas fa-lock"></i>
        <span>Securely connects to studentportal.bdu.edu.et</span>
        <span>·</span>
        <i class="fas fa-database"></i>
        <span>We do not store your password.</span>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login-handler.js"></script>
  
  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
