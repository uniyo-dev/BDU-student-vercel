<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky & Ring Gradient -->
    <linearGradient id="bduRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="50%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>

    <!-- Sunburst Gold Gradient -->
    <linearGradient id="goldRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Torch Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Water Cascade Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="80%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Inner Circle Clip -->
    <clipPath id="innerCircleClip">
      <circle cx="256" cy="256" r="162"/>
    </clipPath>

    <!-- Text Circular Paths -->
    <path id="pathTopAmharic" d="M 46,256 A 210,210 0 0,1 466,256" fill="none"/>
    <path id="pathTopEnglish" d="M 68,256 A 188,188 0 0,1 444,256" fill="none"/>
    <path id="pathBottomAmharic" d="M 72,256 A 184,184 0 0,0 440,256" fill="none"/>
    <path id="pathBottomEnglish" d="M 48,256 A 208,208 0 0,0 464,256" fill="none"/>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. BASE OUTER RING -->
  <circle cx="256" cy="256" r="252" fill="url(#bduRingGrad)"/>
  <circle cx="256" cy="256" r="249" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Inner Rings -->
  <circle cx="256" cy="256" r="166" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="162" fill="#FFFFFF"/>

  <!-- 2. INNER CENTER ARTWORK -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Sky Base -->
    <rect x="94" y="94" width="324" height="324" fill="#FFFBEB"/>

    <!-- 12 Golden Sun Rays Radiating from Center -->
    <g transform="translate(256, 252)">
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(25)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(-25)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(50)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(-50)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(75)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(-75)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(98)"/>
      <polygon points="0,0 -16,-165 16,-165" fill="url(#goldRay)" transform="rotate(-98)"/>
    </g>

    <!-- Green Highland Mountains & River Banks -->
    <path d="M 94,270 Q 150,245 210,265 Q 270,240 330,265 Q 380,248 418,272 L 418,418 L 94,418 Z" fill="#15803D"/>
    <path d="M 94,285 C 130,265 170,275 190,295 C 210,270 240,285 256,280 C 275,285 305,270 325,295 C 350,270 390,275 418,288 L 418,418 L 94,418 Z" fill="#166534"/>
    <path d="M 100,310 C 135,290 170,330 210,315 L 210,418 L 94,418 Z" fill="#14532D"/>
    <path d="M 302,315 C 342,330 377,290 418,310 L 418,418 L 302,418 Z" fill="#14532D"/>

    <!-- Basalt Rock Formations for Falls -->
    <path d="M 170,305 L 185,418 L 327,418 L 342,305 Z" fill="#1E293B"/>
    <path d="M 195,315 L 205,418 L 307,418 L 317,315 Z" fill="#0F172A"/>

    <!-- Blue Nile Cascades (Tis Abay) -->
    <path d="M 198,310 L 205,418 L 222,418 L 216,310 Z" fill="url(#waterGrad)"/>
    <path d="M 226,308 L 228,418 L 244,418 L 242,308 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 248,308 L 248,418 L 264,418 L 264,308 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 270,310 L 268,418 L 285,418 L 292,310 Z" fill="url(#waterGrad)"/>
    <path d="M 296,312 L 292,418 L 306,418 L 312,312 Z" fill="#BAE6FD" opacity="0.8"/>

    <!-- Waterfall Mist / Spray -->
    <ellipse cx="256" cy="308" rx="65" ry="12" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="230" cy="312" rx="35" ry="10" fill="#E0F2FE" opacity="0.85"/>
    <ellipse cx="282" cy="312" rx="35" ry="10" fill="#E0F2FE" opacity="0.85"/>
    <ellipse cx="256" cy="395" rx="55" ry="15" fill="#E0F2FE" opacity="0.75"/>

    <!-- Open Book & Torch -->
    <g transform="translate(256, 280)">
      <!-- Book Outer Blue Cover Outline -->
      <path d="M -66,-2 C -40,-12 -12,-8 0,6 C 12,-8 40,-12 66,-2 L 64,28 C 38,18 12,22 0,34 C -12,22 -38,18 -64,28 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
      
      <!-- White Pages -->
      <path d="M -63,0 C -38,-9 -12,-5 0,8 C 12,-5 38,-9 63,0 L 61,25 C 36,16 12,20 0,31 C -12,20 -36,16 -61,25 Z" fill="#F8FAFC"/>
      
      <!-- Spine Crease -->
      <line x1="0" y1="8" x2="0" y2="31" stroke="#3B82F6" stroke-width="2"/>
      
      <!-- Page Lines -->
      <path d="M -54,6 C -36,-1 -16,2 -4,12" fill="none" stroke="#93C5FD" stroke-width="1.2"/>
      <path d="M -54,12 C -36,5 -16,8 -4,17" fill="none" stroke="#93C5FD" stroke-width="1.2"/>
      <path d="M 4,12 C 16,2 36,-1 54,6" fill="none" stroke="#93C5FD" stroke-width="1.2"/>
      <path d="M 4,17 C 16,8 36,5 54,12" fill="none" stroke="#93C5FD" stroke-width="1.2"/>

      <!-- Foundation Years (1953 E.C. & 1963 G.C.) -->
      <text x="-31" y="21" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" fill="#1E40AF" text-anchor="middle">1953</text>
      <text x="31" y="21" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" fill="#1E40AF" text-anchor="middle">1963</text>

      <!-- Torch & Flame -->
      <rect x="-2" y="-4" width="4" height="14" fill="#92400E" rx="1"/>
      <rect x="-4.5" y="-7" width="9" height="4" fill="#D97706" rx="1"/>
      <path d="M 0,-34 C -12,-24 -11,-14 -5,-7 C -2,-4 2,-4 5,-7 C 11,-14 12,-24 0,-34 Z" fill="url(#flameGrad)" filter="url(#subtleGlow)"/>
      <path d="M 0,-27 C -6,-20 -5,-12 -2,-7 C -1,-5 1,-5 2,-7 C 5,-12 6,-20 0,-27 Z" fill="#FEF08A"/>
    </g>
  </g>

  <!-- 3. CIRCULAR TEXT IN OUTER RING -->
  <!-- Top Line 1 (Outer): "ባሕር ዳር ዩኒቨርሲቲ" -->
  <text fill="#FFFFFF" font-family="'Nyala', 'Abyssinica SIL', 'Segoe UI', sans-serif" font-size="22" font-weight="900" letter-spacing="3.5">
    <textPath href="#pathTopAmharic" startOffset="50%" text-anchor="middle">ባሕር ዳር ዩኒቨርሲቲ</textPath>
  </text>

  <!-- Top Line 2 (Inner): "Bahir Dar University" -->
  <text fill="#FFFFFF" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    <textPath href="#pathTopEnglish" startOffset="50%" text-anchor="middle">Bahir Dar University</textPath>
  </text>

  <!-- Bottom Line 1 (Inner): "ከዓባይ ዳር ጥበብ ሲቀዳ" -->
  <text fill="#FFFFFF" font-family="'Nyala', 'Abyssinica SIL', 'Segoe UI', sans-serif" font-size="18.5" font-weight="800" letter-spacing="2.5">
    <textPath href="#pathBottomAmharic" startOffset="50%" text-anchor="middle">ከዓባይ ዳር ጥበብ ሲቀዳ</textPath>
  </text>

  <!-- Bottom Line 2 (Outer): "Wisdom at the source of the Blue Nile" -->
  <text fill="#FFFFFF" font-family="'Times New Roman', 'Baskerville', 'Georgia', serif" font-style="italic" font-size="13.2" font-weight="600" letter-spacing="1">
    <textPath href="#pathBottomEnglish" startOffset="50%" text-anchor="middle">Wisdom at the source of the Blue Nile</textPath>
  </text>
</svg>