<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0F19">
  <title>BDU & BD Buddy — The Bond of Brothers (Option 2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070A12;
      --card-bg: rgba(13, 19, 33, 0.92);
      --bdu-blue: #1A5F9C;
      --bdu-cyan: #38BDF8;
      --buddy-violet: #D628D9;
      --buddy-magenta: #F43F5E;
      --gold: #FCD34D;
      --gold-dark: #D97706;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Cinematic backdrop light rays */
    .backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 50%, rgba(26, 95, 156, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 50%, rgba(214, 40, 217, 0.22) 0%, transparent 70%),
        radial-gradient(circle at 50% 50%, rgba(252, 211, 77, 0.08) 0%, transparent 60%);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 44px 32px 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 1px 1px rgba(255,255,255,0.06);
      backdrop-filter: blur(24px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Friendship Ribbon */
    .ribbon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(252, 211, 77, 0.1);
      border: 1px solid rgba(252, 211, 77, 0.3);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      animation: heartPulse 1.4s infinite ease-in-out;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    /* ========================================================
       THE TWO-HEARTS MERGE STAGE (INFINITY ORBIT + CLASP)
       ======================================================== */
    .fusion-stage {
      position: relative;
      width: 320px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .canvas-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Interlocking Rings (Infinity) */
    .infinity-track {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 2;
      fill: none;
    }

    .infinity-glow {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 24, 70;
      animation: infinitySprint 2.6s linear infinite;
    }

    @keyframes infinitySprint {
      to { stroke-dashoffset: -188; }
    }

    /* Avatar Halves */
    .comrade-orb {
      position: absolute;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      top: 50%;
      margin-top: -46px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      transition: all 0.4s ease;
    }

    /* Left Brother: Bahir Dar University */
    .orb-bdu {
      left: 36px;
      background: radial-gradient(circle at 35% 30%, #38BDF8, #1A5F9C 60%, #0C2B47);
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 35px rgba(26, 95, 156, 0.6), inset 0 0 14px rgba(56, 189, 248, 0.5);
      animation: swayLeft 3.6s ease-in-out infinite alternate;
    }

    /* Right Brother: BD Buddy */
    .orb-buddy {
      right: 36px;
      background: radial-gradient(circle at 35% 30%, #F472B6, #D628D9 60%, #4A044E);
      border: 2px solid rgba(214, 40, 217, 0.6);
      box-shadow: 0 0 35px rgba(214, 40, 217, 0.6), inset 0 0 14px rgba(244, 114, 182, 0.5);
      animation: swayRight 3.6s ease-in-out infinite alternate;
    }

    @keyframes swayLeft {
      0% { transform: translateX(0) scale(1); }
      100% { transform: translateX(12px) scale(1.04); }
    }

    @keyframes swayRight {
      0% { transform: translateX(0) scale(1); }
      100% { transform: translateX(-12px) scale(1.04); }
    }

    .orb-icon {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    .orb-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 3px;
      color: #FFF;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }

    /* The Central Handshake / Golden Clasp */
    .clasp-center {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FEF08A, #F59E0B 70%, #78350F);
      border: 3px solid #FFF;
      box-shadow: 0 0 25px rgba(252, 211, 77, 0.8), 0 0 50px rgba(214, 40, 217, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      animation: claspThrob 1.8s ease-in-out infinite;
    }

    @keyframes claspThrob {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(252, 211, 77, 0.7); }
      50% { transform: scale(1.18) rotate(6deg); box-shadow: 0 0 35px rgba(252, 211, 77, 1); }
    }

    .clasp-icon {
      width: 26px;
      height: 26px;
      color: #1E1B4B;
      stroke-width: 2.4;
    }

    /* Story Section */
    .story-block {
      margin-top: 6px;
      min-height: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .title-banner {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #38BDF8 0%, #FCD34D 50%, #D628D9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .quote-story {
      font-size: 13.5px;
      color: #CBD5E1;
      line-height: 1.55;
      max-width: 440px;
      transition: opacity 0.25s ease;
      font-weight: 500;
    }

    /* Dual Sync Gauge */
    .sync-panel {
      width: 100%;
      margin-top: 22px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px 18px;
    }

    .gauge-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .gauge-header .side-a { color: var(--bdu-cyan); }
    .gauge-header .side-mid { color: var(--gold); }
    .gauge-header .side-b { color: var(--buddy-violet); }

    .track {
      width: 100%;
      height: 7px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .fill {
      height: 100%;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1A5F9C, #FCD34D 50%, #D628D9 100%);
      box-shadow: 0 0 16px rgba(252, 211, 77, 0.7);
      transition: width 0.4s ease;
    }

    .gauge-sub {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
    }

    /* Interactive Demo Bar */
    .controls {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: #FFF;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--gold);
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #000;
      border: none;
    }
    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(252, 211, 77, 0.3);
    }
  </style>
</head>
<body>

  <div class="backdrop"></div>

  <div class="card">
    
    <!-- Ribbon -->
    <div class="ribbon">
      <span class="pulse-dot"></span>
      <span>Sacred Academic Brotherhood</span>
    </div>

    <!-- The Dual Clasp Visual -->
    <div class="fusion-stage">
      
      <!-- Vector Infinity & Energy Braids -->
      <svg class="canvas-overlay" viewBox="0 0 320 200">
        <defs>
          <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1A5F9C"/>
            <stop offset="45%" stop-color="#FCD34D"/>
            <stop offset="100%" stop-color="#D628D9"/>
          </linearGradient>
        </defs>

        <!-- Figure 8 / Infinity Path -->
        <path class="infinity-track" d="M 82,100 C 82,45 160,45 160,100 C 160,155 238,155 238,100 C 238,45 160,45 160,100 C 160,155 82,155 82,100 Z"/>
        <path class="infinity-glow" stroke="url(#orbitGrad)" d="M 82,100 C 82,45 160,45 160,100 C 160,155 238,155 238,100 C 238,45 160,45 160,100 C 160,155 82,155 82,100 Z"/>
      </svg>

      <!-- Brother 1: BDU (The Mother Institution) -->
      <div class="comrade-orb orb-bdu" title="Bahir Dar University — The Alma Mater">
        <!-- Sunburst & Nile Torch Vector -->
        <svg class="orb-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <!-- Torch & Sun -->
          <circle cx="12" cy="12" r="5" fill="#38BDF8" stroke="#FFF" stroke-width="1.6"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M4.9 19.1l2.2-2.2M16.9 7.1l2.2-2.2"/>
        </svg>
        <span class="orb-tag">BDU</span>
      </div>

      <!-- Center Lock: The Handshake Clasp of Truth -->
      <div class="clasp-center" title="The Bond of Trust: Zero-Persistence, Authentic Data">
        <svg class="clasp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <!-- Two Hands Clasping / Union -->
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
      </div>

      <!-- Brother 2: BD Buddy (The Student's Loyal Shield) -->
      <div class="comrade-orb orb-buddy" title="BD Buddy — The Student's Voice">
        <!-- Graduation Cap Vector -->
        <svg class="orb-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" stroke="#FCD34D"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5" stroke="#FFFFFF"/>
        </svg>
        <span class="orb-tag">BUDDY</span>
      </div>

    </div>

    <!-- Dynamic Storyteller -->
    <div class="story-block">
      <h2 class="title-banner">Brothers in Wisdom</h2>
      <p class="quote-story" id="quoteText">
        "BDU builds the foundation of knowledge. BD Buddy carries the torch to the student's hands."
      </p>
    </div>

    <!-- Dual Sync Gauge -->
    <div class="sync-panel">
      <div class="gauge-header">
        <span class="side-a">BDU PORTAL</span>
        <span class="side-mid">COLLABORATIVE SYNERGY</span>
        <span class="side-b">BD BUDDY</span>
      </div>
      <div class="track">
        <div class="fill" id="syncFill"></div>
      </div>
      <div class="gauge-sub">
        <span id="stepPhase">STEP 01: HANDSHAKE</span>
        <span id="stepAction">PORTAL_PING_OK</span>
      </div>
    </div>

    <!-- Demo Controls -->
    <div class="controls">
      <button class="btn btn-gold" onclick="restartLoop()">↻ Replay Story</button>
      <button class="btn" onclick="finishNow()">✔ Complete</button>
    </div>

  </div>

  <script>
    // Chapter-by-chapter story of friendship and coordination
    const chapters = [
      {
        quote: "“BDU builds the foundation of knowledge. BD Buddy carries the torch straight to the student's hand.”",
        phase: "STEP 01: BROTHERHOOD",
        action: "INSTITUTIONAL_HANDSHAKE",
        progress: "25%"
      },
      {
        quote: "“Like two comrades defending the same goal: Official authenticity protected by modern speed.”",
        phase: "STEP 02: MUTUAL TRUST",
        action: "ENCRYPTED_STREAM",
        progress: "50%"
      },
      {
        quote: "“No competition, only devotion. One delivers the truth; the other makes it shine with dignity.”",
        phase: "STEP 03: CO-CREATION",
        action: "SYNERGY_LOCKED",
        progress: "75%"
      },
      {
        quote: "“From Lake Tana to the palm of your hand: Together, we champion Bahir Dar students!”",
        phase: "STEP 04: UNITED",
        action: "READY_FOR_STUDENT",
        progress: "100%"
      }
    ];

    let current = 0;
    let loopTimer = null;

    const quoteEl = document.getElementById('quoteText');
    const fillEl = document.getElementById('syncFill');
    const phaseEl = document.getElementById('stepPhase');
    const actionEl = document.getElementById('stepAction');

    function showChapter(idx) {
      const ch = chapters[idx];
      quoteEl.style.opacity = '0';
      setTimeout(() => {
        quoteEl.textContent = ch.quote;
        quoteEl.style.opacity = '1';
      }, 200);

      fillEl.style.width = ch.progress;
      phaseEl.textContent = ch.phase;
      actionEl.textContent = ch.action;
    }

    function startCycle() {
      current = 0;
      showChapter(current);

      loopTimer = setInterval(() => {
        current++;
        if (current < chapters.length) {
          showChapter(current);
        } else {
          clearInterval(loopTimer);
        }
      }, 2500);
    }

    function restartLoop() {
      clearInterval(loopTimer);
      startCycle();
    }

    function finishNow() {
      clearInterval(loopTimer);
      showChapter(chapters.length - 1);
    }

    startCycle();
  </script>
</body>
</html>
