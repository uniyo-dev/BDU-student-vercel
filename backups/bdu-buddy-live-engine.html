<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070A12">
  <title>BDU x BD Buddy — Live Particle Sync Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070A12;
      --card-bg: rgba(11, 16, 29, 0.94);
      --bdu-blue: #0284C7;
      --bdu-glow: #38BDF8;
      --buddy-violet: #D628D9;
      --buddy-glow: #F472B6;
      --gold: #FCD34D;
      --text: #F8FAFC;
      --muted: #64748B;
      --border: rgba(255, 255, 255, 0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient CRT scanline texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Main Modal Box */
    .sync-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px 24px 24px;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), 0 0 1px 1px rgba(255,255,255,0.06);
      backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* Active Socket Header */
    .card-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .socket-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #38BDF8;
      text-transform: uppercase;
    }

    .live-beacon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
      animation: beaconFlash 1.1s infinite alternate ease-in-out;
    }

    @keyframes beaconFlash {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .telemetry-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      background: rgba(252, 211, 77, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(252, 211, 77, 0.25);
    }

    /* ============================================================
       INTERACTIVE CANVAS PHYSICS STAGE
       ============================================================ */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 170px;
      margin: 4px 0 10px;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8), rgba(6, 9, 17, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      cursor: crosshair;
    }

    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Station Anchor Labels (Positioned on top of Canvas) */
    .station-anchor {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 3;
      pointer-events: none;
    }

    .station-anchor.left { left: 16px; }
    .station-anchor.right { right: 16px; }

    .anchor-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      border: 2px solid;
      background: #0B101E;
      position: relative;
    }

    .anchor-bdu .anchor-badge {
      border-color: var(--bdu-glow);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    }

    .anchor-buddy .anchor-badge {
      border-color: var(--buddy-glow);
      box-shadow: 0 0 20px rgba(214, 40, 217, 0.35);
    }

    .anchor-badge svg {
      width: 26px;
      height: 26px;
    }

    .anchor-name {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #E2E8F0;
      text-transform: uppercase;
    }

    .anchor-sub {
      font-size: 8.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* Center Real-Time Synthesis Core */
    .synthesis-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(11, 16, 29, 0.9);
      border: 2px solid var(--gold);
      box-shadow: 0 0 25px rgba(252, 211, 77, 0.5);
      z-index: 4;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .core-spark-symbol {
      font-size: 18px;
      color: var(--gold);
      animation: coreRotate 3s linear infinite;
    }

    @keyframes coreRotate {
      to { transform: rotate(360deg); }
    }

    /* Live Terminal Console Log */
    .terminal-console {
      width: 100%;
      background: #04060C;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 10px 14px;
      margin: 8px 0 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      height: 64px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      position: relative;
    }

    .terminal-line {
      display: flex;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: lineIn 0.15s ease-out;
    }

    @keyframes lineIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .term-prefix { color: #38BDF8; font-weight: 700; }
    .term-text { color: #CBD5E1; }
    .term-hash { color: var(--gold); font-size: 10px; }

    /* Progress & Speed Metrics */
    .meter-section {
      width: 100%;
    }

    .meter-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .meter-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #0284C7, #38BDF8, #FCD34D, #D628D9);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(214, 40, 217, 0.7);
      transition: width 0.1s linear;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }

    .metric-label {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .metric-val {
      font-weight: 700;
      color: #FFF;
    }

    /* Action Trigger Buttons */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      width: 100%;
      justify-content: center;
    }

    .btn-act {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #FFF;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-act:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--gold);
    }

    .btn-act.active {
      background: var(--buddy-violet);
      border-color: var(--buddy-violet);
      box-shadow: 0 0 15px rgba(214, 40, 217, 0.5);
    }
  </style>
</head>
<body>

  <main class="sync-card">

    <!-- Top Live Connection Bar -->
    <div class="card-header">
      <div class="socket-status">
        <span class="live-beacon"></span>
        <span id="socketProtocol">WSS://BDU-SYNTHESIS-V4</span>
      </div>
      <div class="telemetry-chip" id="pingMetric">PING: 24ms</div>
    </div>

    <!-- Live Particle Physics Canvas -->
    <div class="canvas-wrapper" id="canvasWrapper" title="Move cursor or touch to perturb the particle bridge!">
      <canvas id="particleCanvas"></canvas>

      <!-- Left Station: BDU Portal -->
      <div class="station-anchor left anchor-bdu">
        <div class="anchor-badge">
          <!-- BDU Torch & Sun Motif -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v10M7 12h10"/>
          </svg>
        </div>
        <span class="anchor-name">BDU Vault</span>
        <span class="anchor-sub">Source Ledger</span>
      </div>

      <!-- Center Fusion Catalyst -->
      <div class="synthesis-core">
        <span class="core-spark-symbol">✦</span>
      </div>

      <!-- Right Station: BD Buddy -->
      <div class="station-anchor right anchor-buddy">
        <div class="anchor-badge">
          <!-- BD Buddy Graduation Cap Motif -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#F472B6" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <span class="anchor-name">BD Buddy</span>
        <span class="anchor-sub">Live Shield</span>
      </div>
    </div>

    <!-- Live Terminal Stream -->
    <div class="terminal-console" id="terminalConsole">
      <div class="terminal-line"><span class="term-prefix">[STREAM]</span> <span class="term-text">Establishing peer-to-peer data bridge...</span></div>
    </div>

    <!-- Meter Section -->
    <div class="meter-section">
      <div class="meter-bar-track">
        <div class="meter-bar-fill" id="meterFill"></div>
      </div>
      
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Rate</div>
          <div class="metric-val" id="metricSpeed">842 KB/s</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Chunk</div>
          <div class="metric-val" id="metricChunk">02 / 07</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Progress</div>
          <div class="metric-val" id="metricProgress">18%</div>
        </div>
      </div>
    </div>

    <!-- Action Switchers -->
    <div class="controls">
      <button class="btn-act active" onclick="setPipeline('pdf')">📄 Export PDF</button>
      <button class="btn-act" onclick="setPipeline('placement')">🎯 Send Choice</button>
      <button class="btn-act" onclick="setPipeline('login')">⚡ Live Sync</button>
    </div>

  </main>

  <script>
    // ============================================================
    // REAL 60 FPS PROCEDURAL PARTICLE SYSTEM (Canvas Physics)
    // ============================================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let w, h;
    function resizeCanvas() {
      w = canvas.width = wrapper.clientWidth;
      h = canvas.height = wrapper.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Mouse/Touch Interaction
    let mouse = { x: -1000, y: -1000, isHovering: false };
    wrapper.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.isHovering = true;
    });
    wrapper.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
      mouse.isHovering = false;
    });

    // Particle Object
    class Particle {
      constructor(direction = 1) {
        this.reset(direction);
      }

      reset(dir = 1) {
        this.dir = dir; // 1: BDU -> Buddy, -1: Buddy -> BDU
        this.x = dir === 1 ? 40 + Math.random() * 20 : w - 40 - Math.random() * 20;
        this.y = h / 2 + (Math.random() - 0.5) * 36;
        this.targetY = h / 2;
        this.vx = (dir === 1 ? 1 : -1) * (2.8 + Math.random() * 3.5);
        this.vy = (Math.random() - 0.5) * 2;
        this.size = 1.6 + Math.random() * 2.2;
        this.life = 1.0;
        this.color = dir === 1 ? '#38BDF8' : '#F472B6';
        if (Math.random() < 0.25) this.color = '#FCD34D'; // Gold synthesis sparks
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Gravitational attraction toward center fusion point
        const centerX = w / 2;
        const centerY = h / 2;
        const distCenter = Math.hypot(centerX - this.x, centerY - this.y);

        if (distCenter < 50) {
          this.vy += (centerY - this.y) * 0.05;
          // Spawn collision brightness
          if (Math.random() < 0.1) this.color = '#FFFFFF';
        }

        // Mouse repulsion physics
        if (mouse.isHovering) {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 60) {
            const force = (60 - dist) / 60;
            this.vx += (dx / dist) * force * 1.5;
            this.vy += (dy / dist) * force * 1.5;
          }
        }

        // Dissolve when arriving at destination node
        if (this.dir === 1 && this.x > w - 45) this.reset(this.dir);
        if (this.dir === -1 && this.x < 45) this.reset(this.dir);
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Initialize Particle Pool
    const particles = [];
    const PARTICLE_COUNT = 65;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle(i % 2 === 0 ? 1 : -1));
    }

    // Central Energy Arc Lines
    function drawElectricArcs() {
      const startX = 52;
      const endX = w - 52;
      const midY = h / 2;

      // Base bridge line
      ctx.beginPath();
      ctx.moveTo(startX, midY);
      ctx.bezierCurveTo(w * 0.35, midY - 24, w * 0.65, midY - 24, endX, midY);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(startX, midY);
      ctx.bezierCurveTo(w * 0.35, midY + 24, w * 0.65, midY + 24, endX, midY);
      ctx.strokeStyle = 'rgba(214, 40, 217, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Pulsing lightning filament
      ctx.beginPath();
      ctx.moveTo(startX, midY);
      const segments = 12;
      const step = (endX - startX) / segments;
      for (let i = 1; i < segments; i++) {
        const x = startX + i * step;
        const jitter = (Math.random() - 0.5) * 6;
        ctx.lineTo(x, midY + jitter);
      }
      ctx.lineTo(endX, midY);
      ctx.strokeStyle = 'rgba(252, 211, 77, 0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, w, h);
      drawElectricArcs();

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(render);
    }
    render();

    // ============================================================
    // LIVE TELEMETRY & NETWORK SIMULATION ENGINE
    // ============================================================
    const terminal = document.getElementById('terminalConsole');
    const meterFill = document.getElementById('meterFill');
    const metricSpeed = document.getElementById('metricSpeed');
    const metricChunk = document.getElementById('metricChunk');
    const metricProgress = document.getElementById('metricProgress');
    const pingMetric = document.getElementById('pingMetric');

    let currentPercent = 5;
    let pipelineMode = 'pdf';
    let ticker = null;

    const pipelineLogs = {
      pdf: [
        "Resolving studentportal.bdu.edu.et session handshake...",
        "Crypt-token OK: Verified __RequestVerificationToken.",
        "Querying /RegistrationSummary/GetCurriculumInfo -> 200 OK.",
        "Streamed 8 course records, SGPA: 4.00, CGPA: 4.00.",
        "Synthesizing Vector Guilloche security layers (#1a5f9c)...",
        "Generating Code-128 Barcode + 12mm Tis Abay Hologram seal.",
        "Rendering ReportLab 3-Page Document Buffer in memory...",
        "Signing with BDU Registrar SHA-256 digital stamp...",
        "Buffer Ready (58.4 KB). Streaming PDF payload to client browser!"
      ],
      placement: [
        "Packaging candidate choice sequence (Rank #1 - #6)...",
        "Checking regional bonus criteria: CANG + Entrance Exam...",
        "Establishing write-socket to /Placement/SubmitPriority...",
        "Payload encrypted with BDU server public key...",
        "Transmitting preference batch to university registrar queue...",
        "Server ACK received: Transaction ID #BDU-PL-94821-OK.",
        "Placement priority successfully registered!"
      ],
      login: [
        "Sending credentials to /Account/Login endpoint...",
        "Extracting ASP.NET Core session cookies...",
        "Bypassing firewall verification: Token validated.",
        "Downloading student profile: Name, ID, Department.",
        "Calculating real-time academic classification...",
        "Sync successful: Zero credentials retained on server."
      ]
    };

    function addLogLine(text) {
      const line = document.createElement('div');
      line.className = 'terminal-line';
      const hash = Math.random().toString(16).substring(2, 8);
      line.innerHTML = `<span class="term-prefix">[${new Date().toLocaleTimeString().split(' ')[0]}]</span> <span class="term-text">${text}</span> <span class="term-hash">#${hash}</span>`;
      terminal.prepend(line);

      // Keep terminal tidy
      if (terminal.children.length > 5) {
        terminal.removeChild(terminal.lastChild);
      }
    }

    function runPipelineCycle() {
      clearInterval(ticker);
      currentPercent = 0;
      let logIndex = 0;
      const logs = pipelineLogs[pipelineMode];

      ticker = setInterval(() => {
        // Micro-jitter progress to feel like real socket traffic
        const increment = 4 + Math.random() * 7;
        currentPercent = Math.min(100, currentPercent + increment);

        meterFill.style.width = currentPercent + '%';
        metricProgress.textContent = Math.floor(currentPercent) + '%';

        // Fluctuating network telemetry
        const speed = (650 + Math.random() * 400).toFixed(0);
        metricSpeed.textContent = `${speed} KB/s`;

        const ping = (18 + Math.random() * 14).toFixed(0);
        pingMetric.textContent = `PING: ${ping}ms`;

        const chunkIndex = Math.min(7, Math.ceil((currentPercent / 100) * 7));
        metricChunk.textContent = `0${chunkIndex} / 07`;

        // Output log statements sequentially
        const targetLogIndex = Math.floor((currentPercent / 100) * logs.length);
        if (targetLogIndex > logIndex && targetLogIndex < logs.length) {
          logIndex = targetLogIndex;
          addLogLine(logs[logIndex]);
        }

        if (currentPercent >= 100) {
          clearInterval(ticker);
          addLogLine("✔ Operation finalized with zero dropped packets.");
          metricSpeed.textContent = "IDLE";
          metricProgress.textContent = "100%";
        }
      }, 350);
    }

    function setPipeline(mode) {
      pipelineMode = mode;
      document.querySelectorAll('.btn-act').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      addLogLine(`Switching pipeline state: [${mode.toUpperCase()}]`);
      runPipelineCycle();
    }

    // Start live simulation
    runPipelineCycle();
  </script>
</body>
</html>
