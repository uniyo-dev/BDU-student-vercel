<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070A14">
  <title>BD Buddy — Placement Submission Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070A14;
      --card-bg: rgba(10, 15, 28, 0.98);
      --bdu-blue: #1E88E5;
      --bdu-cyan: #38BDF8;
      --buddy-violet: #D628D9;
      --gold: #FCD34D;
      --success: #10B981;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Action Card */
    .submit-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    /* Header */
    .submit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .pill {
      background: rgba(214, 40, 217, 0.15);
      border: 1px solid rgba(214, 40, 217, 0.4);
      color: #F472B6;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #F472B6;
      border-radius: 50%;
      box-shadow: 0 0 10px #F472B6;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Submission Uplink Stage */
    .submit-stage {
      width: 100%;
      height: 140px;
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      border: 1px solid var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    /* Uplink Beam */
    .uplink-beam {
      position: absolute;
      left: 55px;
      right: 55px;
      height: 3px;
      background: linear-gradient(90deg, var(--buddy-violet), var(--gold), var(--bdu-cyan));
      z-index: 1;
      opacity: 0.5;
    }

    .uplink-beam::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #FFF, transparent);
      animation: beamPulse 1s linear infinite;
    }

    @keyframes beamPulse {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* Nodes */
    .submit-node {
      position: relative;
      z-index: 2;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .node-buddy {
      background: radial-gradient(circle at 30% 30%, #F472B6, #D628D9 70%, #3B0764);
      border: 2px solid var(--buddy-violet);
    }

    .node-bdu {
      background: radial-gradient(circle at 30% 30%, #38BDF8, #1E88E5 70%, #0F172A);
      border: 2px solid var(--bdu-cyan);
    }

    .submit-node svg {
      width: 26px;
      height: 26px;
      color: #FFF;
    }

    /* Uploading Choice Packet */
    .choice-packet {
      position: absolute;
      top: 50%;
      left: 22%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: var(--gold);
      border-radius: 8px;
      box-shadow: 0 0 20px var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      font-size: 10px;
      font-weight: 900;
      color: #000;
      transition: left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Live Logs */
    .log-box {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .log-line {
      display: flex;
      gap: 8px;
      margin-bottom: 2px;
      animation: fadeInUp 0.3s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-ts { color: var(--muted); }
    .log-cmd { color: var(--buddy-violet); font-weight: 700; }
    .log-msg { color: #E2E8F0; }

    /* Progress UI */
    .progress-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--buddy-violet), var(--gold), var(--success));
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
      transition: width 0.3s linear;
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="submit-card">
    <div class="submit-header">
      <div class="pill">
        <span class="dot"></span>
        PLACEMENT SUBMISSION GATEWAY
      </div>
      <div style="font-size: 10px; font-weight: 800; color: var(--muted);">POST/API</div>
    </div>

    <!-- Submission Uplink Stage -->
    <div class="submit-stage">
      <div class="uplink-beam"></div>

      <!-- BD Buddy Node (Source) -->
      <div class="submit-node node-buddy" title="BD Buddy Client">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>

      <!-- Flying Choice Packet (Traveling Left-to-Right into BDU) -->
      <div class="choice-packet" id="choicePacket">PRI</div>

      <!-- BDU Node (Destination) -->
      <div class="submit-node node-bdu" title="studentportal.bdu.edu.et">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M8 12h8"/></svg>
      </div>
    </div>

    <!-- Live Log Feed -->
    <div class="log-box" id="logBox">
      <!-- Added by JS -->
    </div>

    <!-- Progress UI -->
    <div class="progress-area">
      <div class="progress-info">
        <span id="statusText">Packing department priorities...</span>
        <span id="pctText">0%</span>
      </div>
      <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
      </div>
    </div>

    <div class="footer-note">
      Secure transmission directly to <strong>studentportal.bdu.edu.et</strong>
    </div>
  </div>

  <script>
    const submitLogs = [
      { cmd: "PACK", msg: "Serializing department priorities & choice order." },
      { cmd: "VAL",  msg: "Verifying CANG GPA and high school entrance scores." },
      { cmd: "CSRF", msg: "Attaching __RequestVerificationToken security header." },
      { cmd: "POST", msg: "Transmitting encrypted payload to /Placement/SaveSelection." },
      { cmd: "WAIT", msg: "Awaiting ASP.NET server response..." },
      { cmd: "ACK",  msg: "Server acknowledgment received (200 OK)." },
      { cmd: "REG",  msg: "Placement application timestamp registered." },
      { cmd: "OK",   msg: "Submission successful! Choices locked." }
    ];

    let logIdx = 0;
    let progressVal = 0;
    const logBox = document.getElementById('logBox');
    const progressFill = document.getElementById('progressFill');
    const pctText = document.getElementById('pctText');
    const statusText = document.getElementById('statusText');
    const choicePacket = document.getElementById('choicePacket');

    function appendLog(item) {
      const line = document.createElement('div');
      line.className = 'log-line';
      const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      line.innerHTML = `<span class="log-ts">[${time}]</span><span class="log-cmd">${item.cmd}:</span><span class="log-msg">${item.msg}</span>`;
      logBox.appendChild(line);
      if (logBox.children.length > 4) logBox.removeChild(logBox.children[0]);
    }

    function runSubmit() {
      const timer = setInterval(() => {
        progressVal += 1.2;
        if (progressVal > 100) progressVal = 100;

        progressFill.style.width = progressVal + '%';
        pctText.textContent = Math.floor(progressVal) + '%';

        // Packet movement from BD Buddy (left) to BDU Portal (right)
        let packetPos = 22 + (progressVal * 0.56);
        choicePacket.style.left = packetPos + '%';

        if (progressVal > 25 && progressVal < 50) {
          statusText.textContent = "Validating Academic Criteria...";
          choicePacket.textContent = "GPA";
        } else if (progressVal >= 50 && progressVal < 80) {
          statusText.textContent = "Transmitting to BDU Server...";
          choicePacket.textContent = "POST";
        } else if (progressVal >= 80 && progressVal < 100) {
          statusText.textContent = "Registering Official Timestamp...";
          choicePacket.textContent = "LOCK";
        } else if (progressVal === 100) {
          clearInterval(timer);
          statusText.textContent = "Placement Submitted Successfully!";
          choicePacket.textContent = "✔";
          choicePacket.style.background = "var(--success)";
          choicePacket.style.color = "#FFF";
        }
      }, 40);

      const logTimer = setInterval(() => {
        if (logIdx < submitLogs.length) {
          appendLog(submitLogs[logIdx]);
          logIdx++;
        } else {
          clearInterval(logTimer);
        }
      }, 650);
    }

    window.onload = runSubmit;
  </script>
</body>
</html>
